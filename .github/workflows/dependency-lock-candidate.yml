name: Reviewed dependency lock candidate
on:
  pull_request:
    paths: ['package.json', 'apps/web/package.json', '.github/workflows/dependency-lock-candidate.yml']
permissions:
  contents: read
jobs:
  lock-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a
        with:
          version: 10.12.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Resolve candidate only; normal CI still requires a committed frozen lock
        run: pnpm install --lockfile-only --ignore-scripts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: reviewed-dependency-lock-candidate
          path: pnpm-lock.yaml
          retention-days: 7
