name: Smart contract security analysis

on:
  pull_request:
    paths:
      - "packages/contracts/**"
      - ".github/workflows/security-analysis.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  slither:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: foundry-rs/foundry-toolchain@b00af27efadbc7b4ca8b82abbd903b17cc874d2a # v1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.10"
      - name: Install pinned Uniswap V4 dependencies
        working-directory: packages/contracts
        run: bash scripts/install-v4-deps.sh
      - name: Compile the exact contract tree
        working-directory: packages/contracts
        run: forge build
      - name: Install pinned Slither
        run: python -m pip install --disable-pip-version-check slither-analyzer==0.11.5
      - name: Reject high-severity static-analysis findings
        working-directory: packages/contracts
        # Legacy prototypes remain covered by Foundry tests; this gate targets the reviewed release surface.
        run: >-
          slither .
          --fail-high
          --filter-paths
          "(lib/|test/|script/|broadcast/|src/BondingCurveMarket.sol|src/LaunchRewardVault.sol|src/MemeLaunchFactory.sol|src/LowCostMemeLaunchFactory.sol|src/LowCostMemeLaunchFactoryV2.sol|src/LowCostMemeLaunchFactoryV3.sol|src/clone/CloneBondingCurveMarket.sol)"
