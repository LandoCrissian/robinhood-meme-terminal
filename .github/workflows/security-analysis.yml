name: Smart contract security analysis

on:
  pull_request:
    paths:
      - "packages/contracts/**"
      - "scripts/production-readiness/**"
      - "scripts/treasury/compiler.mjs"
      - "scripts/treasury-v2/**"
      - "scripts/reclaim/**"
      - ".github/workflows/security-analysis.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  slither:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: foundry-rs/foundry-toolchain@b00af27efadbc7b4ca8b82abbd903b17cc874d2a # v1
        with:
          version: "1.7.1"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.10"
      - name: Install pinned Uniswap V4 dependencies
        working-directory: packages/contracts
        run: bash scripts/install-v4-deps.sh
      - name: Compile the exact contract tree
        working-directory: packages/contracts
        run: forge build
      - name: Install pinned Slither
        run: python -m pip install --disable-pip-version-check slither-analyzer==0.11.5
      - name: Reject high-severity static-analysis findings
        working-directory: packages/contracts
        # The review-profile gate below analyzes the exact fixed-supply 4663 compiler closure.
        run: >-
          slither .
          --fail-high
          --filter-paths
          "(lib/|test/|script/|broadcast/)"

  fixed-supply-4663:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a
        with:
          version: 10.12.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.10"
      - uses: foundry-rs/foundry-toolchain@b00af27efadbc7b4ca8b82abbd903b17cc874d2a
        with:
          version: "1.7.1"
      - run: pnpm install --frozen-lockfile --filter @rmt/launch-website...
      - run: bash scripts/install-v4-deps.sh
        working-directory: packages/contracts
      - name: Prepare the pinned review compiler
        id: compiler
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 2 \
            'https://binaries.soliditylang.org/linux-amd64/solc-linux-amd64-v0.8.26+commit.8a97fa7a' \
            --output "$RUNNER_TEMP/solc"
          chmod 700 "$RUNNER_TEMP/solc"
          node packages/contracts/scripts/fixed-supply-profile.mjs \
            --solc "$RUNNER_TEMP/solc" --chain 4663 --verify docs/evidence/fixed-supply-security/4663-profile.json
          node packages/contracts/scripts/fixed-supply-profile.mjs \
            --solc "$RUNNER_TEMP/solc" --chain 4663 --standard-json "$RUNNER_TEMP/fixed-supply-4663.json"
      - run: python -m pip install --disable-pip-version-check slither-analyzer==0.11.5 crytic-compile==0.3.11
      - name: Analyze the pinned compiler closure with every detector
        run: |
          python docs/evidence/rmt-task043/analyze-rotation.py "$RUNNER_TEMP/fixed-supply-4663.json" \
            "$RUNNER_TEMP/solc" "$RUNNER_TEMP/4663-source" "$RUNNER_TEMP/4663-slither.json"
      - name: Reconstruct the unsigned fixture deployment and first RMT project
        if: ${{ !cancelled() && steps.compiler.outcome == 'success' }}
        run: |
          node packages/contracts/scripts/verify-fixed-supply-bundle.mjs \
            --solc "$RUNNER_TEMP/solc" --fork docs/evidence/fixed-supply-release/fork-4663.json.gz \
            --verify docs/evidence/fixed-supply-release/unsigned-bundle.json
      - name: Export the exact Blockscout verification inputs offline
        if: ${{ !cancelled() && steps.compiler.outcome == 'success' }}
        run: |
          node packages/contracts/scripts/export-blockscout-4663.mjs \
            --solc "$RUNNER_TEMP/solc" --output-dir "$RUNNER_TEMP/rmt-blockscout"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: fixed-supply-4663-analysis
          path: |
            ${{ runner.temp }}/fixed-supply-4663.json
            ${{ runner.temp }}/4663-slither.json
            ${{ runner.temp }}/rmt-blockscout
          retention-days: 7

  reclaim-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.10"
      - uses: foundry-rs/foundry-toolchain@b00af27efadbc7b4ca8b82abbd903b17cc874d2a
        with:
          version: "1.7.1"
      - name: Compile all Reclaim production roots and every reachable import
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 2 \
            'https://binaries.soliditylang.org/linux-amd64/solc-linux-amd64-v0.8.26+commit.8a97fa7a' \
            --output "$RUNNER_TEMP/solc"
          chmod 700 "$RUNNER_TEMP/solc"
          node scripts/reclaim/compiler.mjs --solc "$RUNNER_TEMP/solc" \
            --standard-json "$RUNNER_TEMP/reclaim.json" --manifest "$RUNNER_TEMP/reclaim-manifest.json"
      - name: Verify isolated custody, exact rewards, hostile callbacks and invariants
        run: forge test --root packages/contracts/reclaim --use "$RUNNER_TEMP/solc" -vvv
      - run: python -m pip install --disable-pip-version-check slither-analyzer==0.11.5 crytic-compile==0.3.11
      - name: Run every detector and preserve strict failure on new Reclaim highs
        # No detector/source/dependency filters. Supplements all retained gates.
        run: |
          python docs/evidence/rmt-task043/analyze-rotation.py "$RUNNER_TEMP/reclaim.json" \
            "$RUNNER_TEMP/solc" "$RUNNER_TEMP/reclaim-source" "$RUNNER_TEMP/reclaim-slither.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: reclaim-v1-analysis
          path: |
            ${{ runner.temp }}/reclaim.json
            ${{ runner.temp }}/reclaim-manifest.json
            ${{ runner.temp }}/reclaim-slither.json
          retention-days: 7

  treasury-purchase-v2-prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.10"
      - uses: foundry-rs/foundry-toolchain@b00af27efadbc7b4ca8b82abbd903b17cc874d2a
        with:
          version: "1.7.1"
      - name: Compile every local-only prototype source and reachable dependency
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 2 \
            'https://binaries.soliditylang.org/linux-amd64/solc-linux-amd64-v0.8.26+commit.8a97fa7a' \
            --output "$RUNNER_TEMP/solc"
          chmod 700 "$RUNNER_TEMP/solc"
          node scripts/treasury-v2/compiler.mjs --solc "$RUNNER_TEMP/solc" \
            --standard-json "$RUNNER_TEMP/purchase-v2.json" --manifest "$RUNNER_TEMP/purchase-v2-manifest.json"
      - name: Run prototype policy, invariant and exact V1 security regressions
        run: forge test --root packages/contracts/treasury-purchase-v2 --use "$RUNNER_TEMP/solc" -vvv
      - run: python -m pip install --disable-pip-version-check slither-analyzer==0.11.5 crytic-compile==0.3.11
      - name: Analyze all prototype detectors without clearing retained custody findings
        run: |
          python docs/evidence/rmt-task043/analyze-rotation.py "$RUNNER_TEMP/purchase-v2.json" \
            "$RUNNER_TEMP/solc" "$RUNNER_TEMP/purchase-v2-source" "$RUNNER_TEMP/purchase-v2-slither.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: treasury-purchase-v2-prototype-analysis
          path: |
            ${{ runner.temp }}/purchase-v2.json
            ${{ runner.temp }}/purchase-v2-manifest.json
            ${{ runner.temp }}/purchase-v2-slither.json
          retention-days: 7

  project-treasury-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.10"
      - uses: foundry-rs/foundry-toolchain@b00af27efadbc7b4ca8b82abbd903b17cc874d2a
        with:
          version: "1.7.1"
      - name: Compile every new treasury production source and reachable dependency
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 2 \
            'https://binaries.soliditylang.org/linux-amd64/solc-linux-amd64-v0.8.26+commit.8a97fa7a' \
            --output "$RUNNER_TEMP/solc"
          chmod 700 "$RUNNER_TEMP/solc"
          node scripts/treasury/compiler.mjs --solc "$RUNNER_TEMP/solc" \
            --standard-json "$RUNNER_TEMP/project-treasury.json" \
            --manifest "$RUNNER_TEMP/project-treasury-manifest.json"
      - name: Run isolated treasury contract regressions, fuzzing and invariants
        run: forge test --root packages/contracts/project-treasury --use "$RUNNER_TEMP/solc" -vvv
      - run: python -m pip install --disable-pip-version-check slither-analyzer==0.11.5 crytic-compile==0.3.11
      - name: Analyze the complete new module with every detector and reject high findings
        # No detector, dependency or source-path filters. This supplements rather
        # than replaces either retained core gate above.
        run: |
          python docs/evidence/rmt-task043/analyze-rotation.py "$RUNNER_TEMP/project-treasury.json" \
            "$RUNNER_TEMP/solc" "$RUNNER_TEMP/project-treasury-source" "$RUNNER_TEMP/project-treasury-slither.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: project-treasury-v1-analysis
          path: |
            ${{ runner.temp }}/project-treasury.json
            ${{ runner.temp }}/project-treasury-manifest.json
            ${{ runner.temp }}/project-treasury-slither.json
          retention-days: 7
