name: Terminal high-end acceptance

on:
  pull_request:
    paths:
      - ".github/scripts/terminal-high-end-acceptance.mjs"
      - ".github/workflows/terminal-high-end-acceptance.yml"
      - "apps/web/app/external-market-chart.tsx"
      - "apps/web/app/external-market-feed.tsx"
      - "apps/web/app/external-market-feed-v10.tsx"
      - "apps/web/app/external-market-workspace.tsx"
      - "apps/web/app/responsive-external-market-feed.tsx"
      - "apps/web/app/page.tsx"
      - "apps/web/app/layout.tsx"
      - "apps/web/app/terminal-desktop-v9.css"
      - "apps/web/app/terminal-high-end-v10.css"
      - "apps/web/app/terminal-high-end-v10-final.css"
      - "apps/web/app/terminal-minor-fixes-v10.css"
      - "apps/web/lib/external-market*.ts"
      - "apps/web/lib/live-signal-engine.ts"
      - "apps/web/lib/terminal-workstation-smoke.ts"
      - "apps/web/lib/watchlist.ts"
      - "apps/web/package.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terminal-high-end-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NEXT_PUBLIC_RMT_NETWORK: mainnet
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
        with:
          version: 10.12.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Verify terminal types
        run: pnpm --filter web typecheck
      - name: Build production terminal
        run: pnpm --filter web build
      - name: Start production build
        run: |
          nohup pnpm --filter web exec next start -p 3000 > /tmp/rmt-high-end.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/ >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/rmt-high-end.log
          exit 1
      - name: Install isolated Chromium
        run: |
          mkdir -p /tmp/rmt-high-end terminal-high-end-evidence
          cd /tmp/rmt-high-end
          npm init -y
          npm install --save-exact --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify workstation behavior and capture evidence
        shell: bash
        run: |
          cp .github/scripts/terminal-high-end-acceptance.mjs /tmp/rmt-high-end/acceptance.mjs
          set +e
          node /tmp/rmt-high-end/acceptance.mjs 2>&1 | tee /tmp/terminal-high-end.log
          status=${PIPESTATUS[0]}
          echo "--- acceptance tail ---"
          tail -n 240 /tmp/terminal-high-end.log
          echo "--- server tail ---"
          tail -n 120 /tmp/rmt-high-end.log || true
          exit $status
      - name: Upload high-end evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v6.0.0
        with:
          name: terminal-high-end-evidence
          path: terminal-high-end-evidence
          retention-days: 7
