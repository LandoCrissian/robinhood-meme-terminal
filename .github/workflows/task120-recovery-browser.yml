name: Task120 quote lifecycle regression and browser acceptance
on:
  push:
    branches: [codex/task120-netlify-cannacat-pilot]
    paths: ['apps/web/lib/embed/**', '.github/scripts/cannacat-panel-browser.ts', '.github/workflows/task120-recovery-browser.yml', '.github/task120-pilot/**']
permissions:
  contents: read
jobs:
  boundary-and-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a
        with:
          version: 10.12.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web exec tsx lib/embed/cannacat-embed-smoke.ts
      - run: pnpm --filter web exec tsx lib/vnext/zero-x-adapter-smoke.ts
      - run: pnpm --filter web exec tsx lib/vnext/wallet-submission-smoke.ts
      - run: pnpm --filter web exec tsx lib/vnext/native-output-settlement-smoke.ts
      - run: pnpm --filter web exec tsx lib/server/official-settlement-trace-smoke.ts
      - run: pnpm --filter web exec tsx lib/server/historical-settlement-trace-smoke.ts
      - run: pnpm --filter web exec tsx lib/vnext/execution-recovery-smoke.ts
      - run: pnpm typecheck
      - run: pnpm --filter web exec node scripts/build-cannacat-client.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cannacat-client-sdk
          path: apps/web/cannacat-sdk/
          retention-days: 7
  panel-browser:
    runs-on: windows-2025
    # Includes a real 15-minute foreground pricing soak in each browser.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, msedge]
    env:
      CANNACAT_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a
        with:
          version: 10.12.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web exec node scripts/build-cannacat-client.mjs
      - run: pnpm --filter web exec node scripts/build-cannacat-client.mjs --acceptance
      - name: Build pinned Task115 before-layout fixture (never delivered)
        run: |
          git fetch --no-tags --depth=1 origin af597d2d8ccf0c4db05e993ac5dd4bbf32171399
          pnpm --filter web exec node scripts/build-cannacat-client.mjs --acceptance-baseline
      - run: pnpm --filter web exec tsx ../../.github/scripts/cannacat-panel-browser.ts
        working-directory: .
      - run: pnpm --filter web exec tsx ../../.github/scripts/cannacat-historical-browser.ts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: cannacat-panel-${{ matrix.browser }}
          path: |
            cannacat-browser-evidence/
            cannacat-historical-evidence/
          retention-days: 7
  historical-webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CANNACAT_BROWSER: webkit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a
        with:
          version: 10.12.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web exec playwright install --with-deps webkit
      - run: pnpm --filter web exec node scripts/build-cannacat-client.mjs --acceptance
      - run: pnpm --filter web exec tsx ../../.github/scripts/cannacat-historical-browser.ts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: cannacat-historical-webkit
          path: cannacat-historical-evidence/
          retention-days: 7
