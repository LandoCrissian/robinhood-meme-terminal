name: PoH Core V0.1

on:
  push:
    branches:
      - research/poh-core-v0.1
    paths:
      - "research/proof-of-holding-core/**"
      - ".github/workflows/poh-core.yml"
  pull_request:
    paths:
      - "research/proof-of-holding-core/**"
      - ".github/workflows/poh-core.yml"

permissions:
  contents: read

jobs:
  foundry:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: research/proof-of-holding-core
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: foundry-rs/foundry-toolchain@b00af27efadbc7b4ca8b82abbd903b17cc874d2a # v1
        with:
          version: v1.7.1
      - name: Show Foundry version
        run: forge --version
      - name: Install OpenZeppelin Contracts 5.6.1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lib
          git clone --depth 1 --branch v5.6.1 \
            https://github.com/OpenZeppelin/openzeppelin-contracts.git \
            lib/openzeppelin-contracts
          test "$(git -C lib/openzeppelin-contracts describe --tags --exact-match)" = "v5.6.1"
      - name: Format working copy
        run: forge fmt
      - name: Archive formatted PoH sources
        shell: bash
        run: tar -czf "$RUNNER_TEMP/poh-formatted.tar.gz" src test
      - name: Build
        run: forge build --sizes
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          forge test -vvv 2>&1 | tee "$RUNNER_TEMP/forge-test.log"
      - name: Upload formatted PoH sources
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: poh-rewards-formatted-source
          path: ${{ runner.temp }}/poh-formatted.tar.gz
          if-no-files-found: error
          retention-days: 3
      - name: Upload PoH reward test log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: poh-rewards-forge-test-log
          path: ${{ runner.temp }}/forge-test.log
          if-no-files-found: warn
          retention-days: 3

  simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: research/proof-of-holding-core/simulation
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Run independent reference-model tests
        run: python -m unittest discover -s . -p 'test_*.py' -v
