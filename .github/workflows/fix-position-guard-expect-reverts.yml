name: Fix Position Guard exact custom-error assertions

on:
  pull_request:
    paths:
      - ".github/workflows/fix-position-guard-expect-reverts.yml"

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply exact custom-error assertions and remove this workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("packages/contracts/test/RMTPositionGuardExecutor.t.sol")
          text = path.read_text()

          replacements = {
              "    function expectRevert(bytes4 selector) external;\n": (
                  "    function expectRevert(bytes4 selector) external;\n"
                  "    function expectRevert(bytes calldata revertData) external;\n"
              ),
              "        vm.expectRevert(RMTPositionGuardExecutor.UnsafeMinimumOutput.selector);\n"
              "        vm.prank(WALLET);\n"
              "        executor.executeV3Exit(_exit(orderId, required - 1));\n": (
                  "        vm.expectRevert(abi.encodeWithSelector(\n"
                  "            RMTPositionGuardExecutor.UnsafeMinimumOutput.selector,\n"
                  "            required - 1,\n"
                  "            required\n"
                  "        ));\n"
                  "        vm.prank(WALLET);\n"
                  "        executor.executeV3Exit(_exit(orderId, required - 1));\n"
              ),
              "        vm.expectRevert(RMTPositionGuardExecutor.ExactAllowanceRequired.selector);\n"
              "        vm.prank(WALLET);\n"
              "        executor.registerV3Order(_registration(orderId, AMOUNT));\n": (
                  "        vm.expectRevert(abi.encodeWithSelector(\n"
                  "            RMTPositionGuardExecutor.ExactAllowanceRequired.selector,\n"
                  "            AMOUNT + 1,\n"
                  "            AMOUNT\n"
                  "        ));\n"
                  "        vm.prank(WALLET);\n"
                  "        executor.registerV3Order(_registration(orderId, AMOUNT));\n"
              ),
              "        vm.expectRevert(RMTPositionGuardExecutor.ExactAllowanceRequired.selector);\n"
              "        vm.prank(WALLET);\n"
              "        executor.executeV3Exit(_exit(orderId, 88 ether));\n": (
                  "        vm.expectRevert(abi.encodeWithSelector(\n"
                  "            RMTPositionGuardExecutor.ExactAllowanceRequired.selector,\n"
                  "            AMOUNT + 1,\n"
                  "            AMOUNT\n"
                  "        ));\n"
                  "        vm.prank(WALLET);\n"
                  "        executor.executeV3Exit(_exit(orderId, 88 ether));\n"
              ),
              "        vm.expectRevert(RMTPositionGuardExecutor.InsufficientBalance.selector);\n"
              "        vm.prank(WALLET);\n"
              "        executor.executeV3Exit(_exit(orderId, 88 ether));\n": (
                  "        vm.expectRevert(abi.encodeWithSelector(\n"
                  "            RMTPositionGuardExecutor.InsufficientBalance.selector,\n"
                  "            99 ether,\n"
                  "            AMOUNT\n"
                  "        ));\n"
                  "        vm.prank(WALLET);\n"
                  "        executor.executeV3Exit(_exit(orderId, 88 ether));\n"
              ),
          }

          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match, found {count}: {old[:80]!r}")
              text = text.replace(old, new, 1)

          path.write_text(text)
          Path(".github/workflows/fix-position-guard-expect-reverts.yml").unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/contracts/test/RMTPositionGuardExecutor.t.sol .github/workflows/fix-position-guard-expect-reverts.yml
          git commit -m "test(contracts): assert parameterized executor errors exactly"
          git push origin HEAD:${{ github.head_ref }}
