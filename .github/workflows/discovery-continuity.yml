name: Discovery continuity
on:
  pull_request:
    paths:
      - "apps/launch-website/**"
      - "apps/indexer/**"
      - "packages/launchpad-common/**"
      - "scripts/discovery/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/discovery-continuity.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-postgres-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_PASSWORD: synthetic-discovery-ci-only
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:synthetic-discovery-ci-only@127.0.0.1:55432/rmt_curve_production_smoke_http_ci088
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a
        with:
          version: 10.12.1
      - name: Install pinned dependencies
        run: pnpm install --frozen-lockfile
      - name: Use the signed Ubuntu archive over HTTPS for browser dependencies
        run: bash .github/scripts/prepare-browser-apt.sh
      - name: Install Chromium and WebKit
        run: pnpm exec playwright install --with-deps chromium webkit
      - name: Build actual website with financial gates closed
        run: pnpm --filter @rmt/launch-website build
      - name: Exercise authenticated PostgreSQL discovery through real Next and browsers
        run: RMT_DISCOVERY_REPORT_DIR="$RUNNER_TEMP/rmt088-browser" pnpm --filter indexer exec tsx ../../scripts/discovery/continuity.ts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: discovery-continuity-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/rmt088-browser/continuity.json
            ${{ runner.temp }}/rmt088-browser/*.png
            ${{ runner.temp }}/rmt088-browser/next-server.log
