name: Refresh terminal lockfile

on:
  push:
    branches: [feat/terminal-rebuild]

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/terminal-rebuild
          fetch-depth: 0
      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
        with:
          version: 10.12.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Regenerate the frozen lockfile
        run: pnpm install --lockfile-only
      - name: Commit the generated lockfile and remove this one-shot workflow
        run: |
          git rm .github/workflows/refresh-terminal-lockfile.yml
          git add package.json pnpm-lock.yaml
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(deps): refresh patched production lockfile"
          git push origin HEAD:feat/terminal-rebuild
