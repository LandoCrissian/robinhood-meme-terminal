name: RMT MCP Read Registry Smoke

on:
  push:
    branches:
      - codex/agent-engine-foundation
    paths:
      - "apps/rmt-mcp/src/tool-contract.ts"
      - "apps/rmt-mcp/src/career-tool.ts"
      - "apps/rmt-mcp/src/read-registry.ts"
      - "apps/rmt-mcp/src/read-registry-smoke.ts"
      - "apps/agent-engine/src/paper-arena-public-*.ts"
      - "packages/agent-core/src/**"
      - ".github/workflows/rmt-mcp-read-registry-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  registry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run six-tool read registry smoke
        run: node --experimental-strip-types apps/rmt-mcp/src/read-registry-smoke.ts
