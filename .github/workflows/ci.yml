name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build

  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/contracts
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bash scripts/install-v4-deps.sh
      - run: forge fmt
      - name: Build contracts
        run: |
          set -o pipefail
          forge build 2>&1 | tee forge-build.log
          forge build --sizes --skip script --skip test 2>&1 | tee -a forge-build.log
      - name: Upload Foundry diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foundry-build-log
          path: packages/contracts/forge-build.log
          retention-days: 3
      - run: forge test -vvv
      - name: Verify wallet deployment artifacts
        run: |
          node scripts/export-testnet-web-artifacts.mjs
          git diff --exit-code -- ../../apps/web/lib/generated/testnet-stack.json
      - name: Upload wallet deployment artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wallet-deployment-artifacts
          path: apps/web/lib/generated/testnet-stack.json
          retention-days: 3
      - name: Validate deployment scripts
        run: |
          bash -n scripts/deploy-testnet.sh
          bash -n scripts/smoke-test-factory.sh
          bash -n scripts/deploy-mainnet.sh
          bash -n scripts/smoke-test-mainnet.sh
