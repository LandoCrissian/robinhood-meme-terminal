name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build

  indexer:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: rmt
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rmt"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/rmt
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter indexer typecheck
      - run: pnpm --filter indexer build
      - run: pnpm --filter indexer test:schema

  external-origin-indexer:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: rmt_external_origin
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rmt_external_origin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      EXTERNAL_ORIGIN_DATABASE_URL: postgres://postgres:postgres@localhost:5432/rmt_external_origin
      EXTERNAL_ORIGIN_READ_TOKEN: ci-external-origin-read-token-0000000000000001
      PGSSLMODE: disable
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter external-origin-indexer typecheck
      - run: pnpm --filter external-origin-indexer build
      - run: pnpm --filter external-origin-indexer test:schema
      - run: pnpm --filter external-origin-indexer test:api
      - run: pnpm --filter external-origin-indexer test:candidates

  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/contracts
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bash scripts/install-v4-deps.sh
      - name: Verify mainnet release formatting
        run: |
          forge fmt --check \
            script/MainnetReleaseConfig.sol \
            script/DeployMainnetMemeLaunchFactory.s.sol \
            script/MainnetReleaseConfigV6.sol \
            script/DeployMainnetV6OfficialMigration.s.sol \
            src/RMTV6Governance.sol \
            src/RMTV6BootstrapController.sol \
            src/RMTV6BootstrapFoundationVerifier.sol \
            src/RMTV6BootstrapSmokeVerifier.sol \
            src/RMTLaunchGate.sol \
            src/RMTLaunchPolicyRegistry.sol \
            src/RMTLaunchFactoryV6.sol \
            src/VersionedFactoryRegistry.sol \
            src/OfficialRMTIdentityMigration.sol \
            src/DirectLaunchFeeSplitter.sol \
            src/clone/CloneBondingCurveMarketV6.sol \
            src/V5GraduationHook.sol \
            src/V4GraduationAdapter.sol \
            test/MainnetReleaseConfig.t.sol \
            test/MainnetReleaseConfigV6.t.sol \
            test/RMTV6Governance.t.sol \
            test/RMTV6BootstrapController.t.sol \
            test/RMTV6BootstrapFlow.t.sol \
            test/RMTLaunchGate.t.sol \
            test/RMTLaunchPolicyRegistry.t.sol \
            test/RMTLaunchFactoryV6.t.sol \
            test/DirectLaunchFeeSplitter.t.sol \
            test/V4GraduationAdapter.t.sol \
            test/V6MainnetFork.t.sol \
            test/VersionedFactoryRegistry.t.sol
      - name: Build the exact checked-in contract sources
        run: |
          set -o pipefail
          git diff --exit-code -- .
          forge build 2>&1 | tee forge-build.log
          forge build --sizes --skip script --skip test 2>&1 | tee -a forge-build.log
          git diff --exit-code -- .
      - name: Upload Foundry diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foundry-build-log
          path: packages/contracts/forge-build.log
          retention-days: 3
      - run: forge test -vvv
      - name: Verify wallet deployment artifacts
        run: |
          node scripts/export-testnet-web-artifacts.mjs
          node scripts/export-mainnet-web-artifacts.mjs
          git diff --exit-code -- \
            ../../apps/web/lib/generated/testnet-stack.json \
            ../../apps/web/lib/generated/mainnet-stack.json
      - name: Upload wallet deployment artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wallet-deployment-artifacts
          path: |
            apps/web/lib/generated/testnet-stack.json
            apps/web/lib/generated/mainnet-stack.json
          retention-days: 3
      - name: Validate deployment scripts
        run: |
          bash -n scripts/deploy-testnet.sh
          bash -n scripts/smoke-test-factory.sh
          bash -n scripts/deploy-mainnet.sh
          bash -n scripts/smoke-test-mainnet.sh
          bash -n scripts/test-mainnet-fork.sh
          bash -n scripts/verify-mainnet-v6.sh
