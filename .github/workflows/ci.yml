name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build

  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/contracts
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge fmt
      - name: Build contracts
        run: |
          set -o pipefail
          forge build --sizes 2>&1 | tee forge-build.log
      - name: Upload Foundry diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foundry-build-log
          path: packages/contracts/forge-build.log
          retention-days: 3
      - run: forge test -vvv
      - run: bash -n scripts/deploy-testnet.sh
      - run: bash -n scripts/smoke-test-factory.sh
