name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a
        with:
          version: 10.12.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit:production
      - run: pnpm check:repo
      - name: Fetch exact historical browser evidence sources
        run: |
          git fetch --no-tags --depth=1 origin 526cf004d267596f6203f977be40439825f1204b
          git fetch --no-tags --depth=1 origin c1ae53179c7e8ad91c637af0471a20a2f2c67b3c
          git fetch --no-tags --depth=1 origin c7e75623ff1163d8c36fd110fc7cf5188b814db1
          git fetch --no-tags --depth=1 origin d0e26573d3df350ffdad5bf0d558a0c3947e57bf
          git fetch --no-tags --depth=1 origin 4892d2af5ac09ae00975c2b799b66bec0d172779
          git fetch --no-tags --depth=1 origin 06e84522f3a920449e364399a74a7a46eb1ac68f
          git fetch --no-tags --depth=1 origin 50e278401ef6e0e66a5f38045295b97cf6b5d930
          git fetch --no-tags --depth=1 origin 1509403140ebcf9e7134db83b154bb091784e85a
          git fetch --no-tags --depth=1 origin 2641f11b4718250038aab3e93870d3151ae1054c
      - run: pnpm test:release-evidence
      - uses: foundry-rs/foundry-toolchain@b00af27efadbc7b4ca8b82abbd903b17cc874d2a
        with:
          version: "1.7.1"
      - name: Materialize existing pinned contract dependencies for full source verification
        run: bash scripts/install-v4-deps.sh
        working-directory: packages/contracts
      - run: node scripts/security/findings-register.mjs --check
      - run: node --test scripts/security/findings-register.test.mjs
      - run: node --test scripts/treasury-v2/*.test.mjs
      - run: node --test scripts/reclaim/*.test.mjs
      - name: Fetch exact historical Reclaim source boundary
        run: git fetch --no-tags --depth=1 origin da5ba64636c4da67a6a2b0447d1c2849bf01fa97
      - run: node --test scripts/reclaim-v2/*.test.mjs
      - run: node --test scripts/profiles/browser-response-observer.test.mjs
      - run: pnpm test:production-readiness
      - run: pnpm test:protocol-continuation
      - run: pnpm test:constructor-readiness
      - run: pnpm test:governance-publication
      - run: pnpm test:governance-transaction
      - run: pnpm test:release-policy
      - run: pnpm probe:production-readiness --fixture --output "$RUNNER_TEMP/readiness-fixture.json"

  operations-safe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a
        with:
          version: 10.12.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile --filter @rmt/launch-website...
      - name: Verify the standalone Safe evaluation and authorization boundary with fixtures
        run: node --test docs/evidence/mobile-signing/operations-safe-release.test.mjs

  indexer:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: rmt
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rmt"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/rmt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
        with:
          version: 10.12.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Verify persistent-worker deployment scopes
        run: node --test scripts/railway-watch-scope.test.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter indexer typecheck
      - run: pnpm --filter indexer build
      - run: pnpm --filter indexer test:resilience
      - run: pnpm --filter indexer exec tsx --test src/curve-fixture-project-treasury-call.test.ts
      - run: pnpm --filter indexer test:provider-budget
      - name: Check concurrent discovery under backfill and complete the measured backlog
        run: |
          for spec in backfill-http activity-backlog verified-empty empty-market; do
            db="rmt_curve_production_smoke_${spec//-/_}"
            docker exec "${{ job.services.postgres.id }}" createdb -U postgres "$db"
            DATABASE_URL="postgres://postgres:postgres@localhost:5432/$db" pnpm --filter indexer "test:$spec"
          done
      - name: Verify recipient-aware earnings pagination, restart and canonical rollback
        run: |
          docker exec "${{ job.services.postgres.id }}" createdb -U postgres rmt_curve_production_smoke_task074
          pnpm --filter indexer test:curve-production
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/rmt_curve_production_smoke_task074
      - name: Verify isolated fee activity and recipient discovery persistence
        run: |
          set -euo pipefail
          # The fixture verifies the server's actual loopback address. A Docker
          # port-forward reports its bridge address, so use an expendable native
          # cluster rather than weakening the fixture database identity check.
          pg_bin="$(pg_config --bindir)"
          fixture_home="$(mktemp -d "$RUNNER_TEMP/rmt-earnings-pg.XXXXXX")"
          fixture_cluster="$fixture_home/cluster"
          fixture_port="$(node -e 'const s=require("node:net").createServer();s.listen(0,"127.0.0.1",()=>{console.log(s.address().port);s.close();});')"
          "$pg_bin/initdb" -D "$fixture_cluster" -U postgres --auth=trust --no-locale --encoding=UTF8
          "$pg_bin/pg_ctl" -D "$fixture_cluster" -l "$fixture_home/postgres.log" \
            -o "-h 127.0.0.1 -p $fixture_port -k $fixture_home" -w start
          trap '"$pg_bin/pg_ctl" -D "$fixture_cluster" -m fast -w stop' EXIT
          "$pg_bin/createdb" -h 127.0.0.1 -p "$fixture_port" -U postgres rmt_curve_fixture_task074_smoke_ci
          RMT_EARNINGS_SMOKE_DATABASE_URL="postgres://postgres@127.0.0.1:$fixture_port/rmt_curve_fixture_task074_smoke_ci" \
            pnpm --filter indexer exec tsx src/curve-fixture-earnings-postgres-smoke.ts
      - run: pnpm --filter indexer test:schema
      - name: Check worker readiness, lease and restart over HTTP
        run: |
          docker exec "${{ job.services.postgres.id }}" createdb -U postgres rmt_worker_smoke
          pnpm --filter indexer test:worker-http
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/rmt_worker_smoke
      - name: Package the tested Railway input
        run: |
          mkdir -p "$RUNNER_TEMP/indexer-release"
          git archive --format=tar --output="$RUNNER_TEMP/indexer-release/worker.tar" HEAD
          git rev-parse HEAD > "$RUNNER_TEMP/indexer-release/source.txt"
          (cd "$RUNNER_TEMP/indexer-release" && sha256sum worker.tar > SHA256SUMS)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rmt-indexer-source-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/indexer-release/
          if-no-files-found: error

  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/contracts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@b00af27efadbc7b4ca8b82abbd903b17cc874d2a
        with:
          version: "1.7.1"
      - run: bash scripts/install-v4-deps.sh
      - name: Verify the exact active Solidity tree
        run: |
          set -euo pipefail
          git diff --exit-code -- .
          forge build 2>&1 | tee forge-build.log
          forge build --sizes --skip script --skip test 2>&1 | tee -a forge-build.log
          git diff --exit-code -- .
      - run: forge test -vvv
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: foundry-build-log
          path: packages/contracts/forge-build.log
          retention-days: 3
