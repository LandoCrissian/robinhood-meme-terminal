name: V6 Graduation Rehearsal

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/v6-graduation-rehearsal.yml"
      - "packages/contracts/src/**"
      - "packages/contracts/test/V6MainnetFork.t.sol"
      - "packages/contracts/test/V6UniversalRouterFork.t.sol"
      - "packages/contracts/script/MainnetReleaseConfigV6.sol"
      - "packages/contracts/scripts/install-v4-deps.sh"
      - "apps/web/lib/server/rmt-v4-trade.ts"
      - "apps/web/lib/uniswap-v4.ts"
  push:
    branches: [main]
    paths:
      - ".github/workflows/v6-graduation-rehearsal.yml"
      - "packages/contracts/src/**"
      - "packages/contracts/test/V6MainnetFork.t.sol"
      - "packages/contracts/test/V6UniversalRouterFork.t.sol"
      - "packages/contracts/script/MainnetReleaseConfigV6.sol"
      - "packages/contracts/scripts/install-v4-deps.sh"
      - "apps/web/lib/server/rmt-v4-trade.ts"
      - "apps/web/lib/uniswap-v4.ts"

permissions:
  contents: read

concurrency:
  group: v6-graduation-rehearsal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mainnet-fork:
    name: Full launch-to-graduation lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: packages/contracts
    env:
      ROBINHOOD_MAINNET_RPC_URL: https://rpc.mainnet.chain.robinhood.com/
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install reviewed Uniswap V4 dependencies
        run: bash scripts/install-v4-deps.sh
      - name: Rehearse the complete V6 lifecycle on a mainnet fork
        run: |
          forge test --match-contract V6MainnetForkTest -vvv
          forge test --match-contract V6UniversalRouterForkTest -vvv
