name: Task125 hosted WalletConnect readiness
on:
  push:
    branches: [codex/task125-rabbykit-auth]
    paths: ['.github/scripts/task125-hosted-relay.ts', '.github/workflows/task125-hosted-relay.yml']
permissions:
  contents: read
jobs:
  relay:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a
        with:
          version: 10.12.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web exec tsx ../../.github/scripts/task125-hosted-relay.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: task125-hosted-relay-${{ github.sha }}
          path: apps/web/task125-relay/
          if-no-files-found: error
          retention-days: 14
