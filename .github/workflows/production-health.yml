name: Production liveness

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-liveness
  cancel-in-progress: true

jobs:
  verify:
    name: Verify canonical domain and Terminal health
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check lightweight Production liveness
        shell: bash
        run: |
          set -euo pipefail
          apex="https://rmtlaunch.fun"
          base="https://www.rmtlaunch.fun"
          mkdir -p health-artifacts

          redirect="$(curl --silent --show-error --head --max-time 25 "$apex" | tr -d '\r' | awk 'BEGIN{IGNORECASE=1} /^location:/{print $2; exit}')"
          if [[ "$redirect" != "$base/" && "$redirect" != "$base" ]]; then
            echo "Expected $apex to redirect to $base; received: ${redirect:-none}" >&2
            exit 1
          fi

          for attempt in 1 2 3; do
            if curl --silent --show-error --fail --location --max-time 25 \
              --dump-header "health-artifacts/health.headers" \
              "$base/api/health" --output "health-artifacts/health.json"; then
              break
            fi
            if [[ "$attempt" == "3" ]]; then
              exit 1
            fi
            sleep $((attempt * 3))
          done

          node scripts/verify-production-liveness.mjs health-artifacts

      - name: Preserve liveness evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-liveness
          path: health-artifacts/
          retention-days: 7
