name: Production health

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-health
  cancel-in-progress: true

jobs:
  verify:
    name: Verify live protocol and data
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check canonical domain, protocol, and application health
        shell: bash
        run: |
          set -euo pipefail
          apex="https://rmtlaunch.fun"
          base="https://www.rmtlaunch.fun"
          indexer="https://robinhood-meme-terminal-production.up.railway.app"
          mkdir -p health-artifacts

          redirect="$(curl --silent --show-error --head --max-time 25 "$apex" | tr -d '\r' | awk 'BEGIN{IGNORECASE=1} /^location:/{print $2; exit}')"
          if [[ "$redirect" != "$base/" && "$redirect" != "$base" ]]; then
            echo "Expected $apex to redirect to $base; received: ${redirect:-none}" >&2
            exit 1
          fi

          check_endpoint() {
            local name="$1"
            local url="$2"
            local headers="${3:-}"
            local output="health-artifacts/$name.json"
            for attempt in 1 2 3; do
              if [[ -n "$headers" ]]; then
                if curl --silent --show-error --fail --location --max-time 25 \
                  --dump-header "$headers" "$url" --output "$output"; then
                  return 0
                fi
              elif curl --silent --show-error --fail --location --max-time 25 "$url" --output "$output"; then
                return 0
              fi
              sleep $((attempt * 3))
            done
            return 1
          }

          check_endpoint protocol "$base/api/health" "health-artifacts/protocol.headers"
          check_endpoint launches "$base/api/launches" "health-artifacts/launches.headers"
          check_endpoint indexer "$indexer/health"
          while read -r name address; do
            check_endpoint "search-$name" "$base/api/vnext/market-search?q=$address"
          done <<'MARKET_CONTROLS'
          stonkbroker 0xe934e36a439c94017b64a3fece66af12099abf50
          pons 0x39dbed3a2bd333467115de45665cc57f813c4571
          pipedog 0x5cb6f181081301b44905f3ae15419112ecabd8a6
          cashcat 0x020bfc650a365f8bb26819deaabf3e21291018b4
          lemon 0xf0e17e54239cd945cd7bea471a3a2ca6a8c7f7a3
          MARKET_CONTROLS
          check_endpoint search-stonkbroker-text "$base/api/vnext/market-search?q=STONKBROKER"
          if ! curl --silent --show-error --fail --location --max-time 25 \
            --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/127.0.0.0 Safari/537.36" \
            --dump-header "health-artifacts/home.headers" "$base/" --output "health-artifacts/home.html"; then
            echo "Public home page is unavailable to a standard Windows browser." >&2
            exit 1
          fi
          check_endpoint robots "$base/robots.txt"
          check_endpoint sitemap "$base/sitemap.xml"
          mv health-artifacts/robots.json health-artifacts/robots.txt
          mv health-artifacts/sitemap.json health-artifacts/sitemap.xml

          node scripts/verify-production-health.mjs health-artifacts
          node scripts/verify-public-surface.mjs health-artifacts

      - name: Preserve health evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-health
          path: health-artifacts/
          retention-days: 7
