name: Production health

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-health
  cancel-in-progress: true

jobs:
  verify:
    name: Verify live protocol and data
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Check canonical domain, protocol, and application health
        shell: bash
        run: |
          set -euo pipefail
          apex="https://rmtlaunch.fun"
          base="https://www.rmtlaunch.fun"
          indexer="https://robinhood-meme-terminal-production.up.railway.app"
          official_market="0xb26Fb775c0ac365d369BEe9ac2E044C5D90FfBee"
          mkdir -p health-artifacts

          redirect="$(curl --silent --show-error --head --max-time 25 "$apex" | tr -d '\r' | awk 'BEGIN{IGNORECASE=1} /^location:/{print $2; exit}')"
          if [[ "$redirect" != "$base/" && "$redirect" != "$base" ]]; then
            echo "Expected $apex to redirect to $base; received: ${redirect:-none}" >&2
            exit 1
          fi

          check_endpoint() {
            local name="$1"
            local url="$2"
            local headers="${3:-}"
            local output="health-artifacts/$name.json"
            for attempt in 1 2 3; do
              if [[ -n "$headers" ]]; then
                if curl --silent --show-error --fail --location --max-time 25 \
                  --dump-header "$headers" "$url" --output "$output"; then
                  return 0
                fi
              elif curl --silent --show-error --fail --location --max-time 25 "$url" --output "$output"; then
                return 0
              fi
              sleep $((attempt * 3))
            done
            return 1
          }

          check_endpoint protocol "$base/api/health" "health-artifacts/protocol.headers"
          check_endpoint launches "$base/api/launches" "health-artifacts/launches.headers"
          check_endpoint indexer "$indexer/health"
          check_endpoint trades "$base/api/markets/$official_market/trades?limit=1" "health-artifacts/trades.headers"

          node scripts/verify-production-health.mjs health-artifacts

      - name: Preserve health evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-health
          path: health-artifacts/
          retention-days: 7
