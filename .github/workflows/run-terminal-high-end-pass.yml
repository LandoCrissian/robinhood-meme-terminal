name: Run terminal high-end pass

on:
  push:
    branches:
      - fix/terminal-desktop-layout-v9
    paths:
      - ".terminal-high-end-trigger"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/terminal-desktop-layout-v9
          fetch-depth: 0
      - name: Execute staged patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/apply-terminal-high-end-pass.yml').read_text()
          marker = "          python3 <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          script = textwrap.dedent(workflow[start:end])
          exec(compile(script, 'terminal-high-end-pass.py', 'exec'))
          PY

          rm -f .github/workflows/run-terminal-high-end-pass.yml .terminal-high-end-trigger
          git diff --check
          git status --short
      - name: Commit completed terminal pass
        shell: bash
        run: |
          git config user.name "rmt-terminal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat(web): complete high-end terminal workstation pass"
          git push origin HEAD:fix/terminal-desktop-layout-v9
