name: Task120 isolated Netlify API artifact
on:
  push:
    branches: [codex/task120-netlify-cannacat-pilot]
    paths: ['.github/task120-pilot/**', '.github/workflows/task120-netlify-pilot.yml', 'apps/web/lib/embed/**']
permissions:
  contents: read
jobs:
  api-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      redis:
        image: redis:7.4
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a
        with:
          version: 10.12.1
      - run: pnpm install --frozen-lockfile
      - name: Typecheck the isolated Node hosting adapter
        working-directory: apps/web
        run: pnpm exec tsc --noEmit --allowImportingTsExtensions --module esnext --moduleResolution bundler --target es2022 --lib es2022,dom --types node,next --skipLibCheck --strict --esModuleInterop --resolveJsonModule --jsx preserve ../../.github/task120-pilot/cannacat.mts
      - name: Unchanged focused execution and recovery regressions
        working-directory: apps/web
        run: |
          pnpm test:cannacat-embed
          pnpm test:trade-identity
          pnpm exec tsx lib/server/historical-settlement-trace-smoke.ts
          pnpm exec tsx lib/vnext/zero-x-firm-quote-commitment-smoke.ts
          pnpm exec tsx lib/vnext/zero-x-firm-quote-verifier-smoke.ts
      - name: Verify passive observation, full types and client build
        run: |
          pnpm --filter web exec tsx lib/embed/cannacat-observation-smoke.ts
          pnpm typecheck
          pnpm --filter web exec node scripts/build-cannacat-client.mjs
      - name: Bundle unchanged handlers without Next or a trading terminal
        run: |
          git fetch --no-tags --depth=1 origin 5ee50aa9a776dfa70cc2708ba7fa57394c0b229d
          node .github/task120-pilot/build.mjs
      - name: Adapter authentication and preview isolation tests
        run: node .github/task120-pilot/adapter-test.mjs
      - name: Shared quota startup for the preserved RMT server
        run: pnpm --filter web exec tsx ../../.github/task120-pilot/server-quota-startup-test.mts
      - name: Atomic application-wide quota across independent workers
        run: |
          command -v redis-cli || (sudo apt-get update -qq && sudo apt-get install -y redis-tools)
          node --experimental-strip-types .github/task120-pilot/quota-acceptance.mts
      - name: Package with Netlify's official Functions library
        env:
          TASK120_PACKAGER: ${{ runner.temp }}/task120-netlify-packager
        run: |
          npm install --prefix "$TASK120_PACKAGER" @netlify/zip-it-and-ship-it@16.5.1
          node .github/task120-pilot/package.mjs
      - name: Hash every deployable member
        run: node .github/task120-pilot/seal.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: task120-netlify-api-${{ github.sha }}
          path: task120-artifact/
          if-no-files-found: warn
          retention-days: 14
  server-startup-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_RMT_NETWORK: mainnet
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a
        with:
          version: 10.12.1
      - run: pnpm install --frozen-lockfile
      - name: Compile supported Next server instrumentation (never deployed)
        run: pnpm --filter web exec next build
