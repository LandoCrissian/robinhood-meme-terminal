name: Robinhood 4663 launch fork evidence

on:
  pull_request:
    paths:
      - ".github/workflows/robinhood-4663-launch-fork.yml"
      - "packages/contracts/**/*.sol"
      - "packages/contracts/scripts/*4663*.mjs"
      - "packages/contracts/scripts/*4663*.json"
      - "apps/web/**/*4663*"
      - "apps/web/app/api/launchpad/**"
      - "apps/web/app/mcp/**"
      - "apps/web/lib/launchpad/**"
      - "apps/web/lib/server/new-launchpad-*.ts"
      - "pnpm-lock.yaml"
  workflow_dispatch:
    inputs:
      archive:
        description: Read-only Robinhood archive for the entire fork run
        type: choice
        options: [pocket, drpc, pinax]
        default: pocket

permissions:
  contents: read

concurrency:
  group: robinhood-launch-fork-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  guarded-v2-loopback-fork:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
        with:
          version: 10.12.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: foundry-rs/foundry-toolchain@b00af27efadbc7b4ca8b82abbd903b17cc874d2a # v1
        with:
          version: "1.7.1"
      - run: pnpm install --frozen-lockfile
      - run: bash scripts/install-v4-deps.sh
        working-directory: packages/contracts
      - name: Fetch the compiler checked by the review build
        run: |
          curl --fail --silent --show-error --retry 2 \
            'https://binaries.soliditylang.org/linux-amd64/solc-linux-amd64-v0.8.26+commit.8a97fa7a' \
            --output "$RUNNER_TEMP/solc-0.8.26"
          chmod 700 "$RUNNER_TEMP/solc-0.8.26"
      - name: Exercise the exact V2 review build on loopback Anvil
        working-directory: apps/web
        env:
          FORK_ARCHIVE: ${{ inputs.archive || 'pocket' }}
        run: |
          set -euo pipefail
          node --import tsx ../../packages/contracts/scripts/validate-launch-4663-fork.mjs \
            --anvil "$(command -v anvil)" --solc "$RUNNER_TEMP/solc-0.8.26" --archive "$FORK_ARCHIVE" \
            > "$RUNNER_TEMP/robinhood-4663-fork-evidence.json" \
            2> >(tee "$RUNNER_TEMP/robinhood-4663-fork-diagnostics.log" >&2)
          node -e 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"))' \
            "$RUNNER_TEMP/robinhood-4663-fork-evidence.json"
          sha256sum "$RUNNER_TEMP/robinhood-4663-fork-evidence.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: robinhood-4663-fork-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/robinhood-4663-fork-evidence.json
            ${{ runner.temp }}/robinhood-4663-fork-diagnostics.log
