name: Agent Canonical Valuation Scheduler Smoke

on:
  push:
    branches:
      - codex/agent-engine-foundation
    paths:
      - "apps/agent-engine/src/paper-canonical-valuation-scheduler.ts"
      - "apps/agent-engine/src/paper-canonical-valuation-scheduler-smoke.ts"
      - "apps/agent-engine/src/paper-canonical-valuation-store.ts"
      - ".github/workflows/agent-valuation-scheduler-smoke.yml"
  pull_request:
    paths:
      - "apps/agent-engine/src/paper-canonical-valuation-scheduler.ts"
      - "apps/agent-engine/src/paper-canonical-valuation-scheduler-smoke.ts"
      - "apps/agent-engine/src/paper-canonical-valuation-store.ts"
      - ".github/workflows/agent-valuation-scheduler-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run canonical valuation scheduler smoke
        run: node --experimental-strip-types apps/agent-engine/src/paper-canonical-valuation-scheduler-smoke.ts
