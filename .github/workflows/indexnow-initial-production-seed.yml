name: IndexNow one-time production seed

# One-shot release workflow: it runs only when this file changes on main.
# Do not add a schedule or broaden the paths filter.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/indexnow-initial-production-seed.yml

permissions:
  contents: read

concurrency:
  group: indexnow-initial-production-seed
  cancel-in-progress: false

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
        with:
          version: 10.12.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Verify deployed proof and public sitemap
        env:
          SITE_URL: https://www.rmtlaunch.fun
          INDEXNOW_KEY: rmt-indexnow-public-proof-2026
        shell: bash
        run: |
          set -euo pipefail
          proof="$(curl --fail --silent --show-error --retry 5 --retry-all-errors --max-time 20 "$SITE_URL/$INDEXNOW_KEY.txt" | tr -d '\r\n')"
          test "$proof" = "$INDEXNOW_KEY"

          sitemap="$(curl --fail --silent --show-error --retry 5 --retry-all-errors --max-time 20 "$SITE_URL/sitemap.xml")"
          grep -Fq "<loc>$SITE_URL/</loc>" <<<"$sitemap"
          grep -Fq "<loc>$SITE_URL/robinhood-chain</loc>" <<<"$sitemap"
          grep -Fq "<loc>$SITE_URL/markets/robinhood-chain</loc>" <<<"$sitemap"
          grep -Fq "<loc>$SITE_URL/markets/robinhood-chain/trending</loc>" <<<"$sitemap"
          grep -Fq "<loc>$SITE_URL/markets/robinhood-chain/new</loc>" <<<"$sitemap"
          grep -Fq "<loc>$SITE_URL/markets/robinhood-chain/active</loc>" <<<"$sitemap"
          if grep -Fq "<loc>https://rmtlaunch.fun" <<<"$sitemap"; then
            echo "Sitemap contains a non-canonical origin." >&2
            exit 1
          fi
      - name: Submit the production sitemap once
        run: pnpm --filter web exec tsx scripts/indexnow-submit.ts
