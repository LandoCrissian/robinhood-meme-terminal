name: Apply terminal execution reliability V11

on:
  push:
    branches:
      - feat/terminal-pro-workflow-v11
    paths:
      - ".github/workflows/apply-terminal-execution-reliability-v11.yml"
      - "scripts/apply-terminal-execution-reliability-v11.py"

permissions:
  contents: write

concurrency:
  group: apply-terminal-execution-reliability-v11
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/terminal-pro-workflow-v11
          fetch-depth: 0
      - name: Apply execution reliability integration
        run: |
          python3 scripts/apply-terminal-execution-reliability-v11.py
          rm -f scripts/apply-terminal-execution-reliability-v11.py
          rm -f .github/workflows/apply-terminal-execution-reliability-v11.yml
          git diff --check
          git status --short
      - name: Commit integration
        run: |
          git config user.name "rmt-terminal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat(web): integrate recoverable trade execution"
          git push origin HEAD:feat/terminal-pro-workflow-v11
