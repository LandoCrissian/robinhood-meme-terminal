name: Apply terminal high-end pass

on:
  push:
    branches:
      - fix/terminal-desktop-layout-v9
    paths:
      - ".github/workflows/apply-terminal-high-end-pass.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/terminal-desktop-layout-v9
          fetch-depth: 0
      - name: Apply terminal product changes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one exact match, found {count}")
              file.write_text(text.replace(old, new, 1))

          def regex_once(path: str, pattern: str, replacement: str) -> None:
              file = Path(path)
              text = file.read_text()
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"{path}: expected one regex match, found {count}: {pattern[:80]}")
              file.write_text(updated)

          feed = "apps/web/app/external-market-feed.tsx"
          replace_once(
              feed,
              'import { deriveLiveMarketSignals, type LiveMarketSignal } from "../lib/live-signal-engine";\n',
              'import { deriveLiveMarketSignals, type LiveMarketSignal } from "../lib/live-signal-engine";\n'
              'import {\n'
              '  addToWatchlist,\n'
              '  readWatchlist,\n'
              '  removeFromWatchlist,\n'
              '  WATCHLIST_EVENT\n'
              '} from "../lib/watchlist";\n'
          )
          replace_once(
              feed,
              'type VenueFilter = "all" | LaunchDistributionVenue;\n',
              'type VenueFilter = "all" | LaunchDistributionVenue;\n'
              'type MarketSortKey = "rank" | "age" | "valuation" | "change5m" | "volume1h" | "liquidity" | "risk";\n'
              'type MarketSortDirection = "asc" | "desc";\n'
              'type MarketSort = { key: MarketSortKey; direction: MarketSortDirection };\n'
          )

          live_signal_block = r'''function defaultMarketSortDirection(key: MarketSortKey): MarketSortDirection {
  return key === "rank" || key === "age" || key === "risk" ? "asc" : "desc";
}

function marketSortValue(
  market: ExternalMarket,
  key: Exclude<MarketSortKey, "age">,
  rankByAddress: Map<string, number>
) {
  if (key === "rank") return rankByAddress.get(market.address.toLowerCase()) ?? Number.MAX_SAFE_INTEGER;
  if (key === "valuation") return valuation(market).value;
  if (key === "change5m") return market.priceChange5m;
  if (key === "volume1h") return market.volume1h;
  if (key === "liquidity") return market.liquidityUsd;
  return market.riskFlags.length;
}

function sortExternalMarkets(
  markets: ExternalMarket[],
  sort: MarketSort,
  rankByAddress: Map<string, number>
) {
  const direction = sort.direction === "asc" ? 1 : -1;
  return [...markets].sort((left, right) => {
    if (sort.key === "age") {
      if (left.ageMinutes === null && right.ageMinutes === null) return left.name.localeCompare(right.name);
      if (left.ageMinutes === null) return 1;
      if (right.ageMinutes === null) return -1;
      const difference = (left.ageMinutes - right.ageMinutes) * direction;
      if (difference !== 0) return difference;
    } else {
      const difference = (
        marketSortValue(left, sort.key, rankByAddress)
        - marketSortValue(right, sort.key, rankByAddress)
      ) * direction;
      if (difference !== 0) return difference;
    }
    const rankDifference = (
      (rankByAddress.get(left.address.toLowerCase()) ?? Number.MAX_SAFE_INTEGER)
      - (rankByAddress.get(right.address.toLowerCase()) ?? Number.MAX_SAFE_INTEGER)
    );
    return rankDifference || left.name.localeCompare(right.name);
  });
}

function momentumBarWidth(value: number) {
  if (!Number.isFinite(value)) return 4;
  return Math.min(100, Math.max(Math.abs(value) < 0.01 ? 4 : 12, Math.abs(value) * 4));
}

function LiveSignalCard({ signal }: { signal: LiveMarketSignal }) {
  return (
    <a
      href={`/market/${signal.token}?tab=activity`}
      className={signal.severity}
      data-kind={signal.kind}
    >
      <span><b>{signal.severity === "urgent" ? "URGENT" : signal.severity === "review" ? "REVIEW" : "OBSERVE"}</b><em>${cleanSymbol(signal.symbol)}</em></span>
      <strong>{signal.title}</strong>
      <small>{signal.evidence}</small>
    </a>
  );
}

function LiveSignalDesk({ signals }: { signals: LiveMarketSignal[] }) {
  const [boardOpen, setBoardOpen] = useState(false);
  const board = useRef<HTMLElement>(null);
  const closeButton = useRef<HTMLButtonElement>(null);
  const returnFocusTo = useRef<HTMLElement | null>(null);
  const closeBoard = useCallback(() => setBoardOpen(false), []);

  useEffect(() => {
    if (!boardOpen) return;
    const previousOverflow = document.body.style.overflow;
    const handleKeyDown = (event: KeyboardEvent) => {
      if (event.key === "Escape") {
        event.preventDefault();
        closeBoard();
        return;
      }
      if (event.key !== "Tab" || !board.current) return;
      const focusable = Array.from(board.current.querySelectorAll<HTMLElement>(
        'a[href], button:not([disabled]), [tabindex]:not([tabindex="-1"])'
      )).filter((element) => {
        const style = window.getComputedStyle(element);
        return style.display !== "none" && style.visibility !== "hidden";
      });
      if (focusable.length === 0) {
        event.preventDefault();
        board.current.focus();
        return;
      }
      const first = focusable[0];
      const last = focusable[focusable.length - 1];
      if (event.shiftKey && document.activeElement === first) {
        event.preventDefault();
        last.focus();
      } else if (!event.shiftKey && document.activeElement === last) {
        event.preventDefault();
        first.focus();
      }
    };

    document.body.style.overflow = "hidden";
    window.addEventListener("keydown", handleKeyDown);
    closeButton.current?.focus();
    return () => {
      document.body.style.overflow = previousOverflow;
      window.removeEventListener("keydown", handleKeyDown);
      window.setTimeout(() => returnFocusTo.current?.focus(), 0);
    };
  }, [boardOpen, closeBoard]);

  const openBoard = () => {
    returnFocusTo.current = document.activeElement instanceof HTMLElement ? document.activeElement : null;
    setBoardOpen(true);
  };

  return (
    <section className="liveSignalDesk" aria-labelledby="live-signal-desk-title">
      <header>
        <span><small>RMT LIVE SIGNAL DESK</small><strong id="live-signal-desk-title">Markets requiring attention</strong></span>
        {signals.length > 5
          ? <button className="liveSignalBoardButton" type="button" aria-haspopup="dialog" onClick={openBoard}>View all {signals.length}</button>
          : <span className="liveSignalCount">{signals.length} live</span>}
      </header>
      {signals.length ? (
        <div className="liveSignalRail" aria-label="Highest-priority live market signals">
          {signals.map((signal) => <LiveSignalCard signal={signal} key={signal.id} />)}
        </div>
      ) : (
        <div className="liveSignalEmpty"><strong>No market has cleared a live signal threshold.</strong><span>RMT continues checking activity, pace, price and liquidity every 30 seconds.</span></div>
      )}
      <footer>Read-only observations from validated public market snapshots · open a market for confirmed swap and wallet evidence · never a profit promise or automatic trade</footer>

      {boardOpen && signals.length > 5 && <>
        <button className="liveSignalBoardBackdrop" type="button" tabIndex={-1} aria-label="Close complete signal board" onClick={closeBoard} />
        <section
          ref={board}
          className="liveSignalBoardDialog"
          role="dialog"
          aria-modal="true"
          aria-labelledby="live-signal-board-title"
          tabIndex={-1}
        >
          <header>
            <div>
              <small>RMT SIGNAL BOARD</small>
              <strong id="live-signal-board-title">All qualified market signals</strong>
              <span>{signals.length} markets · ranked by severity and signal strength</span>
            </div>
            <button ref={closeButton} type="button" onClick={closeBoard}>Close</button>
          </header>
          <div className="liveSignalBoardGrid">
            {signals.map((signal) => <LiveSignalCard signal={signal} key={`board:${signal.id}`} />)}
          </div>
          <footer>Signals are automated review candidates from validated public snapshots. They are not recommendations, profit promises, or automatic trades.</footer>
        </section>
      </>}
    </section>
  );
}
'''
