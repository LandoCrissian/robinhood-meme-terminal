name: Wallet profiles

on:
  pull_request:
    paths:
      - 'apps/launch-website/**'
      - 'scripts/profiles/**'
      - 'config/firebase/**'
      - 'firebase.profiles.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/profiles.yml'

permissions:
  contents: read

jobs:
  isolated-firebase:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a
        with:
          version: 10.12.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @rmt/launch-website typecheck
      - run: pnpm --filter @rmt/launch-website test:history
      - run: pnpm --filter @rmt/launch-website build
      - run: pnpm exec playwright install --with-deps chromium webkit
      - name: Test rules, real Firebase sessions, profiles and mobile browser flow
        run: >-
          node scripts/profiles/run-emulator-tests.mjs --command
          "node --test scripts/profiles/emulator-rules.test.mjs && pnpm --filter @rmt/launch-website exec tsx --test lib/server/profiles/emulator.test.ts && node apps/launch-website/scripts/profile-ui-smoke.mjs"
        env:
          RMT_PROFILE_UI_ARTIFACTS: ${{ runner.temp }}/profile-browser-evidence
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: profile-browser-evidence
          path: ${{ runner.temp }}/profile-browser-evidence
          retention-days: 7
