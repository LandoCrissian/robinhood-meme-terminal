name: Task120 returning-wallet acceptance
on:
  push:
    branches: [codex/task120-netlify-cannacat-pilot]
    paths: ['.github/workflows/task120-wallet-return.yml', '.github/scripts/cannacat-wallet-return-browser.ts', 'apps/web/lib/embed/cannacat-panel.tsx', 'apps/web/lib/testing/cannacat-privy-fixture.tsx', '.github/task120-pilot/**']
permissions:
  contents: read
jobs:
  returning-wallet:
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chrome
            os: windows-2025
          - browser: msedge
            os: windows-2025
          - browser: webkit
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      CANNACAT_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a
        with:
          version: 10.12.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - if: matrix.browser == 'webkit'
        run: pnpm --filter web exec playwright install --with-deps webkit
      - run: pnpm --filter web exec node scripts/build-cannacat-client.mjs --acceptance
      - run: pnpm --filter web exec tsx ../../.github/scripts/cannacat-wallet-return-browser.ts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: cannacat-wallet-return-${{ matrix.browser }}
          path: cannacat-wallet-return-evidence/
          retention-days: 7
