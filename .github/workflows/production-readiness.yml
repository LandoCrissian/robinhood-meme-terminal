name: Production deep readiness

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deep-readiness
  cancel-in-progress: true

jobs:
  verify:
    name: Verify live Terminal and data
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check canonical domain, Terminal, and application readiness
        shell: bash
        run: |
          set -euo pipefail
          apex="https://rmtlaunch.fun"
          base="https://www.rmtlaunch.fun"
          mkdir -p health-artifacts

          redirect="$(curl --silent --show-error --head --max-time 25 "$apex" | tr -d '\r' | awk 'BEGIN{IGNORECASE=1} /^location:/{print $2; exit}')"
          if [[ "$redirect" != "$base/" && "$redirect" != "$base" ]]; then
            echo "Expected $apex to redirect to $base; received: ${redirect:-none}" >&2
            exit 1
          fi

          check_endpoint() {
            local name="$1"
            local url="$2"
            local headers="${3:-}"
            local output="health-artifacts/$name.json"
            for attempt in 1 2 3; do
              if [[ -n "$headers" ]]; then
                if curl --silent --show-error --fail --location --max-time 25 \
                  --dump-header "$headers" "$url" --output "$output"; then
                  return 0
                fi
              elif curl --silent --show-error --fail --location --max-time 25 "$url" --output "$output"; then
                return 0
              fi
              sleep $((attempt * 3))
            done
            return 1
          }

          check_endpoint health "$base/api/health" "health-artifacts/health.headers"
          check_endpoint directory "$base/api/vnext/market-directory" "health-artifacts/directory.headers"
          while read -r name symbol address; do
            check_endpoint "search-$name" "$base/api/vnext/market-search?q=$address"
            check_endpoint "search-$name-text" "$base/api/vnext/market-search?q=$symbol"
          done <<'MARKET_CONTROLS'
          stonkbroker STONKBROKER 0xe934e36a439c94017b64a3fece66af12099abf50
          pons PONS 0x39dbed3a2bd333467115de45665cc57f813c4571
          pipedog PIPEDOG 0x5cb6f181081301b44905f3ae15419112ecabd8a6
          cashcat CASHCAT 0x020bfc650a365f8bb26819deaabf3e21291018b4
          lemon LEMON 0xf0e17e54239cd945cd7bea471a3a2ca6a8c7f7a3
          peep PEEP 0xf0821f2bf570ca4e7499a9ed9db7c788fed9946f
          hopium HOPIUM 0xb6ce51925c2e397ebf1a443b343d19267b3d4225
          cannacat CANNACAT 0x1139d423c1706bdead91f03507f521635591ed92
          MARKET_CONTROLS
          if ! curl --silent --show-error --fail --location --max-time 25 \
            --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/127.0.0.0 Safari/537.36" \
            --dump-header "health-artifacts/home.headers" "$base/" --output "health-artifacts/home.html"; then
            echo "Public home page is unavailable to a standard Windows browser." >&2
            exit 1
          fi
          if ! curl --silent --show-error --fail --location --max-time 25 \
            --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/127.0.0.0 Safari/537.36" \
            --dump-header "health-artifacts/vnext.headers" "$base/vnext" --output "health-artifacts/vnext.html"; then
            echo "The supported /vnext compatibility route is unavailable." >&2
            exit 1
          fi
          check_endpoint robots "$base/robots.txt"
          check_endpoint sitemap "$base/sitemap.xml"
          mv health-artifacts/robots.json health-artifacts/robots.txt
          mv health-artifacts/sitemap.json health-artifacts/sitemap.xml

          node scripts/verify-production-health.mjs health-artifacts
          node scripts/verify-public-surface.mjs health-artifacts

      - name: Preserve readiness evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-readiness
          path: health-artifacts/
          retention-days: 7
