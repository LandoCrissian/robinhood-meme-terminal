name: IndexNow incremental search refresh

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/indexnow-incremental-search-refresh.yml
      - apps/web/scripts/indexnow-static-refresh.ts
      - apps/web/lib/site-identity.ts
      - apps/web/app/layout.tsx
      - apps/web/app/public-chrome.tsx
      - apps/web/app/site-footer.tsx
      - apps/web/app/sitemap.ts
      - apps/web/app/robinhood-chain/**
      - apps/web/app/markets/robinhood-chain/**
      - apps/web/app/explore/**
      - apps/web/app/sushi/**
      - apps/web/app/sources/**
      - apps/web/app/status/**
      - apps/web/app/support/**
      - apps/web/app/risks/**
      - apps/web/app/terms/**
      - apps/web/app/privacy/**
      - apps/web/app/experience/**
      - apps/web/public/brand/**
      - apps/web/next.config.mjs

permissions:
  contents: read

concurrency:
  group: indexnow-incremental-search-refresh
  cancel-in-progress: false

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
        with:
          version: 10.12.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Verify deployed IndexNow ownership proof
        env:
          SITE_URL: https://www.rmtlaunch.fun
          INDEXNOW_KEY: rmt-indexnow-public-proof-2026
        shell: bash
        run: |
          set -euo pipefail
          proof="$(curl --fail --silent --show-error --retry 5 --retry-all-errors --max-time 20 "$SITE_URL/$INDEXNOW_KEY.txt" | tr -d '\r\n')"
          test "$proof" = "$INDEXNOW_KEY"
      - name: Submit only changed canonical public search URLs
        shell: bash
        run: |
          set -euo pipefail
          before="${{ github.event.before }}"
          if [[ -z "$before" || "$before" =~ ^0+$ ]] || ! git cat-file -e "$before^{commit}" 2>/dev/null; then
            before="$(git rev-parse HEAD^)"
          fi
          mapfile -t changed < <(git diff --name-only "$before" "$GITHUB_SHA")
          printf 'Search-facing changed files:\n'
          printf ' - %s\n' "${changed[@]}"
          pnpm --filter web exec tsx scripts/indexnow-static-refresh.ts "${changed[@]}"
