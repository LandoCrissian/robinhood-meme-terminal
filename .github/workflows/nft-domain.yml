name: NFT domain

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  nft-domain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
        with:
          version: 10.12.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web exec tsx lib/nft/nft-domain-smoke.ts
      - run: pnpm --filter web exec tsx lib/nft/project-intake-smoke.ts
      - run: pnpm --filter web exec tsx lib/nft/activity-sources-smoke.ts
      - run: pnpm --filter web exec tsx lib/nft/ownership-projection-smoke.ts
      - run: pnpm --filter web exec tsx lib/nft/activity-ingestion-smoke.ts
