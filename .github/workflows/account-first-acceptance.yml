name: Legacy terminal account-first replay

on:
  workflow_dispatch:

# Archived browser fixtures expect the previous Terminal root and product routes.
env:
  RMT_LEGACY_TERMINAL_BASELINE: 6d0b8103bdad95367445a38e5f5327458baa9ab2

permissions:
  contents: read

concurrency:
  group: account-first-${{ github.ref }}
  cancel-in-progress: true

jobs:
  account-first-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RMT_ACCOUNT_ACCEPTANCE_OUTPUT: "${{ github.workspace }}/account-first-browser-evidence"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RMT_LEGACY_TERMINAL_BASELINE }}
      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
        with:
          version: 10.12.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Verify required-font readiness and incomplete-document capture
        run: node --test .github/scripts/account-first-browser-capture.test.mjs
      - name: Run account-first desktop/mobile journey
        run: pnpm test:account-first-browser
      - name: Upload archived-baseline screenshots and screencasts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: account-first-browser-${{ env.RMT_LEGACY_TERMINAL_BASELINE }}
          path: account-first-browser-evidence
          retention-days: 14

  production-privy-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RMT_PRIVY_BRIDGE_ACCEPTANCE_OUTPUT: "${{ github.workspace }}/privy-bridge-balance-evidence"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RMT_LEGACY_TERMINAL_BASELINE }}
      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
        with:
          version: 10.12.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run real PrivyIdentityBridge and wallet-read acceptance
        run: pnpm test:privy-bridge-browser
      - name: Upload archived-baseline identity and per-asset evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: privy-bridge-balance-${{ env.RMT_LEGACY_TERMINAL_BASELINE }}
          path: privy-bridge-balance-evidence
          retention-days: 14
