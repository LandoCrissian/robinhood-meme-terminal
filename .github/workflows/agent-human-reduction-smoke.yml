name: Agent Human Reduction Smoke

on:
  push:
    branches:
      - codex/agent-engine-foundation
    paths:
      - "apps/agent-engine/src/human-authoritative-position-reduction*.ts"
      - ".github/workflows/agent-human-reduction-smoke.yml"
  pull_request:
    paths:
      - "apps/agent-engine/src/human-authoritative-position-reduction*.ts"
      - ".github/workflows/agent-human-reduction-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run authoritative Human position-reduction smoke
        run: node --experimental-strip-types apps/agent-engine/src/human-authoritative-position-reduction-smoke.ts
