name: Mainnet readiness

on:
  pull_request:
    paths:
      - "packages/contracts/**"
      - ".github/workflows/mainnet-readiness.yml"
  workflow_dispatch:

jobs:
  robinhood-mainnet-fork:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/contracts
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bash scripts/install-v4-deps.sh
      - name: Deploy and verify exact release stack on a Robinhood mainnet fork
        env:
          ROBINHOOD_MAINNET_RPC_URL: https://rpc.mainnet.chain.robinhood.com/
        run: bash scripts/test-mainnet-fork.sh
