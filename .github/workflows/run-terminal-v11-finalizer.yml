name: Run terminal v11 finalizer

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - ".github/workflows/finalize-terminal-v11.yml"

permissions:
  contents: write

concurrency:
  group: terminal-v11-finalizer-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  finalize:
    if: github.head_ref == 'feat/terminal-pro-workflow-v11'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - id: prepare
        name: Apply the reviewed finalizer migration
        shell: bash
        run: |
          if [ ! -f .github/workflows/finalize-terminal-v11.yml ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Finalizer already completed."
            exit 0
          fi
          python3 <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/finalize-terminal-v11.yml').read_text()
          marker = "          python3 <<'PY' 2>&1 | tee /tmp/terminal-v11-patch.log\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          script = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in workflow[start:end].splitlines()
          )
          exec(compile(script, 'terminal-v11-finalizer.py', 'exec'))
          PY
          git diff --check
          echo "skip=false" >> "$GITHUB_OUTPUT"
      - if: steps.prepare.outputs.skip != 'true'
        uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
        with:
          version: 10.12.1
      - if: steps.prepare.outputs.skip != 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - if: steps.prepare.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.prepare.outputs.skip != 'true'
        name: Prove route stability and execution recovery
        env:
          NEXT_PUBLIC_RMT_NETWORK: mainnet
        run: |
          pnpm --filter web test:route-availability
          pnpm --filter web test:trade-reliability
          pnpm --filter web test:trade-speed
          pnpm --filter web test:experience
          pnpm --filter web test:trade-ticket
          pnpm --filter web test:external-sushi
          pnpm --filter web test:external-uniswap
          pnpm --filter web test:external-venues
          pnpm --filter web test:transaction-integrity
          pnpm --filter web test:terminal-workstation
          pnpm --filter web typecheck
          pnpm --filter web build
      - if: steps.prepare.outputs.skip != 'true'
        name: Commit the validated release candidate
        shell: bash
        run: |
          rm .github/workflows/finalize-terminal-v11.yml
          git diff --check
          git config user.name "rmt-terminal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix(web): stabilize route availability and finalize execution recovery"
          git push origin HEAD:feat/terminal-pro-workflow-v11
