name: Secret scan

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Install pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          version="8.30.1"
          archive="gitleaks_${version}_linux_x64.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version
      - name: Verify exact public identity proof and reject broad exceptions
        run: node --test scripts/security/public-history-identities.test.mjs
      - name: Scan all reachable history and adjudicate only immutable public identities
        run: |
          node scripts/security/run-history-scan.mjs --scanner "$RUNNER_TEMP/gitleaks" \
            --output "$RUNNER_TEMP/rmt-history-security-review"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: history-raw-scan-and-public-identity-review-${{ github.sha }}
          path: |
            ${{ runner.temp }}/rmt-history-security-review/history-raw-redacted.json
            ${{ runner.temp }}/rmt-history-security-review/raw-exit-code.txt
            ${{ runner.temp }}/rmt-history-security-review/history-public-classification.json
            ${{ runner.temp }}/rmt-history-security-review/canary-redacted.json
            ${{ runner.temp }}/rmt-history-security-review/canary-rejection.json
          retention-days: 7
