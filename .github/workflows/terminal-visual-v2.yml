name: Terminal visual v2

on:
  pull_request:
    paths:
      - ".github/workflows/terminal-visual-v2.yml"
      - "apps/web/app/**"
      - "apps/web/lib/**"
      - "scripts/visual-qa/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terminal-visual-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NEXT_PUBLIC_RMT_NETWORK: mainnet
      RMT_VNEXT_SHELL_ENABLED: "true"
      NEXT_PUBLIC_RMT_VNEXT_AUTHORIZATION_ENABLED: "false"
      RMT_VNEXT_AUTHORIZATION_ENABLED: "false"
      NEXT_PUBLIC_RMT_VNEXT_WALLET_SUBMISSION_ENABLED: "false"
      NFT_INDEXER_URL: http://127.0.0.1:43111
      NFT_MARKETPLACE_INDEXER_URL: http://127.0.0.1:43111
      NFT_MINT_RADAR_OPENSEA_API_KEY: legion-radar-fixture
      NFT_MINT_RADAR_OPENSEA_BASE_URL: http://127.0.0.1:43111
      RMT_VISUAL_BASE_URL: http://127.0.0.1:3000
      RMT_VISUAL_OUTPUT: terminal-visual-v2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
        with:
          version: 10.12.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Verify Token fixture authority
        run: pnpm --filter web exec tsx ../../scripts/visual-qa/legion-token-fixture-authority-smoke.ts
      - run: pnpm build
      - name: Start production build
        run: |
          fixture_read_token=$(printf 'a%.0s' {1..64})
          export NFT_INDEXER_READ_TOKEN="$fixture_read_token"
          export NFT_MARKETPLACE_INDEXER_READ_TOKEN="$fixture_read_token"
          nohup pnpm --filter web exec next start -p 3000 > /tmp/rmt-terminal.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/ >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/rmt-terminal.log
          exit 1
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Render deterministic Token and NFT evidence
        run: node scripts/visual-qa/legion-visual-qa.mjs --capture-only
      - name: Upload visual evidence and semantic report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: terminal-visual-v2
          path: terminal-visual-v2
          if-no-files-found: warn
          retention-days: 7
