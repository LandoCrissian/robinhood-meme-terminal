name: Terminal visual v2

on:
  pull_request:
    paths:
      - ".github/workflows/terminal-visual-v2.yml"
      - "apps/web/app/**"
      - "apps/web/lib/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terminal-visual-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NEXT_PUBLIC_RMT_NETWORK: mainnet
      RMT_VNEXT_SHELL_ENABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
        with:
          version: 10.12.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Start production build
        run: |
          nohup pnpm --filter web exec next start -p 3000 > /tmp/rmt-terminal.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/ >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/rmt-terminal.log
          exit 1
      - name: Install isolated Chromium
        run: |
          mkdir -p /tmp/rmt-playwright terminal-visual-v2
          cd /tmp/rmt-playwright
          npm init -y
          npm install --save-exact --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Render finite desktop and mobile evidence
        shell: bash
        run: |
          cat > /tmp/rmt-playwright/terminal-visual.mjs <<'SCRIPT'
          import { chromium, devices } from "playwright";
          import { writeFile } from "node:fs/promises";

          const base = "http://127.0.0.1:3000";
          const output = `${process.env.GITHUB_WORKSPACE}/terminal-visual-v2`;
          const token = "0x1111111111111111111111111111111111111111";
          const pair = "0x2222222222222222222222222222222222222222";
          const factory = "0x3333333333333333333333333333333333333333";
          const creator = "0x4444444444444444444444444444444444444444";
          const tx = `0x${"a".repeat(64)}`;
          const evidence = `0x${"b".repeat(64)}`;
          const now = new Date().toISOString();

          const address = (seed) => `0x${seed.toString(16).padStart(40, "0")}`;
          const names = ["Rune Market", "Nova Signal", "Pulse Engine", "Moss Protocol", "Arc Runner", "Tide Network"];
          const symbols = ["RUNE", "NOVA", "PULSE", "MOSS", "ARC", "TIDE"];
          const prices = [0.001842, 0.000092, 0.00831, 0.000441, 0.0248, 0.0000162];
          const changes = [18.62, 6.14, -3.48, 2.31, 32.9, -1.62];

          function market(index) {
            const marketToken = index === 0 ? token : address(0x1001 + index);
            const marketPair = index === 0 ? pair : address(0x2001 + index);
            const sourceId = index % 3 === 0 ? "sushi" : index % 3 === 1 ? "lemon" : "pons";
            const sourceName = sourceId === "sushi" ? "Sushi Launch" : sourceId === "lemon" ? "Lemon" : "Pons";
            const dexId = index % 2 === 0 ? "sushiswap" : "uniswap-v3";
            const protocolVersion = index % 2 === 0 ? 2 : 3;
            const quoteToken = {
              address: "0x5555555555555555555555555555555555555555",
              name: "Wrapped Ether",
              symbol: "WETH"
            };
            const assetId = `eip155:4663/contract:${marketToken}`;
            const priceUsd = prices[index];
            const liquidityUsd = 69000 + index * 31000;
            const marketCapUsd = 470000 + index * 260000;
            const fdvUsd = 560000 + index * 310000;
            const volume24h = 392000 + index * 112000;
            const priceChange24h = changes[index] * 2.1;
            const pairCreatedAt = Date.now() - (index + 1) * 5400000;
            const primaryMarket = {
              chainId: 4663,
              assetId,
              token: { address: marketToken, name: names[index], symbol: symbols[index] },
              venue: dexId,
              protocolVersion,
              pool: { kind: "evm-address", value: marketPair },
              baseToken: { address: marketToken, name: names[index], symbol: symbols[index] },
              quoteToken,
              assetSide: "BASE",
              displayEligibility: "eligible",
              chartEligibility: "eligible",
              executionEligibility: "view-only",
              provenance: "dexscreener-token-pairs",
              priceUsd,
              liquidityUsd,
              marketCapUsd,
              fdvUsd,
              volume24h,
              priceChange24h,
              pairCreatedAt
            };
            return {
              assetId,
              address: marketToken,
              name: names[index],
              symbol: symbols[index],
              pairAddress: marketPair,
              url: `https://robinhoodchain.blockscout.com/address/${marketPair}`,
              dexId,
              project: {
                sourceId,
                sourceName,
                provenance: "factory-and-pool-cross-checked",
                creator,
                launchPool: marketPair,
                name: names[index],
                symbol: symbols[index],
                description: "Deterministic rendering fixture for terminal regression review.",
                imageUri: null,
                socials: { x: "https://x.com/RMTLaunch", telegram: null, discord: null, website: "https://www.rmtlaunch.fun", farcaster: null }
              },
              socials: { x: "https://x.com/RMTLaunch", telegram: null, discord: null, website: "https://www.rmtlaunch.fun", farcaster: null, provenance: "dex-pair-metadata" },
              origin: {
                kind: "external",
                state: "attributed",
                sourceId,
                sourceName,
                coverage: "complete",
                claim: { claimKind: "token-created", sourceId, sourceName, factory, transactionHash: tx, blockNumber: String(12345000 + index), evidenceHash: evidence }
              },
              venue: { kind: "dex", dexId, pairAddress: marketPair, url: `https://robinhoodchain.blockscout.com/address/${marketPair}`, execution: "read-only" },
              priceUsd,
              liquidityUsd,
              marketCapUsd,
              fdvUsd,
              volume5m: 4250 + index * 1350,
              volume1h: 40700 + index * 9700,
              volume24h,
              priceChange5m: changes[index] / 4,
              priceChange1h: changes[index],
              priceChange24h,
              buys5m: 20 + index * 4,
              sells5m: 9 + index * 2,
              buys1h: 121 + index * 19,
              sells1h: 72 + index * 11,
              buys24h: 983 + index * 103,
              sells24h: 587 + index * 71,
              pairCreatedAt,
              ageMinutes: 85 + index * 190,
              momentumScore: 73 + index * 4,
              buyPressureBps: 6350 + index * 140,
              signal: changes[index] > 12 ? "moving" : index < 2 ? "early" : "active",
              riskFlags: index === 5 ? ["thin-liquidity"] : [],
              primaryMarket,
              verifiedMarkets: [primaryMarket]
            };
          }

          const markets = names.map((_, index) => market(index));
          const trades = Array.from({ length: 10 }, (_, index) => ({
            id: `fixture-${index}`,
            transactionHash: `0x${(index + 10).toString(16).repeat(64).slice(0, 64)}`,
            trader: address(0x5000 + index % 5),
            side: index % 3 === 0 ? "sell" : "buy",
            tokenAmount: 120000 + index * 18000,
            quoteAmount: 0.11 + index * 0.018,
            priceUsd: 0.00172 + index * 0.000011,
            volumeUsd: 480 + index * 235,
            timestamp: new Date(Date.now() - index * 27000).toISOString()
          }));

          function candles(range) {
            const count = range === "7D" ? 84 : range === "24H" ? 72 : 42;
            const step = range === "7D" ? 7200 : range === "24H" ? 1200 : 60;
            const start = Math.floor(Date.now() / 1000) - count * step;
            return Array.from({ length: count }, (_, index) => {
              const close = 0.00132 + index * 0.000012 + Math.sin(index / 3.2) * 0.000055;
              const open = close - Math.cos(index / 2.8) * 0.000021;
              return { timestamp: start + index * step, open, high: Math.max(open, close) + 0.000028, low: Math.min(open, close) - 0.000024, close, volume: 3200 + Math.abs(Math.sin(index / 2)) * 9600 };
            });
          }

          const tradePayload = { token, pair, source: "GeckoTerminal", updatedAt: now, trades };
          const riskPayload = {
            token,
            pair,
            marketVerified: true,
            coverage: "complete",
            contract: { sourcePublished: true, isProxy: false, bytecodeChanged: false, controls: { assessment: "no-common-controls-found", detected: [], customWriteFunctions: [], administrator: null, activeLaunchRestrictions: false, restrictionEndBlock: null, maxTransactionBps: null, maxWalletBps: null } },
            liquidity: { controlStatus: "contract-held", evidenceSource: "launchpad-registry", positionManager: factory, positionId: "1842", owner: factory, approvedOperator: null, creatorCanTransfer: false, positionLiquidity: "842000000000000000000" },
            holders: { count: 1842, poolShareBps: 4200, topNonPoolShareBps: 740, topNonPoolHolders: [], largestNonPoolHolder: { address: address(0x7001), shareBps: 210 }, creator, creatorShareBps: 95 },
            sellSimulation: { status: "passed", method: "holder-to-pool-transfer", holder: address(0x7001), amount: "1000000000000000000", returnStyle: "boolean-true" },
            warnings: [],
            checkedAt: now
          };

          function canonicalDirectoryMarket(market) {
            const version = market.primaryMarket.protocolVersion;
            const poolKey = market.primaryMarket.pool.value.toLowerCase();
            return {
              address: market.address,
              assetId: market.assetId,
              name: market.name,
              symbol: market.symbol,
              priceUsd: null,
              liquidityUsd: null,
              marketCapUsd: null,
              volume24h: null,
              priceChange24h: null,
              ageMinutes: null,
              signal: null,
              canonicalMarkets: [{
                sourceId: version === 2 ? "sushiswap-v2" : "uniswap-v3",
                protocol: version === 2 ? "sushiswap" : "uniswap",
                version,
                poolKey,
                poolAddress: poolKey,
                token0: market.address.toLowerCase(),
                token1: market.primaryMarket.quoteToken.address.toLowerCase(),
                stable: null,
                fee: version === 2 ? null : 3_000,
                tickSpacing: version === 2 ? null : 60,
                hooks: null,
                transactionHash: tx,
                blockNumber: "100",
                blockHash: evidence,
                stateStatus: null,
                liveFee: null,
                feeDenominator: null,
                gaugeAddress: null,
                gaugeAlive: null,
                gaugeWeight: null,
                gaugeClaimable: null,
                feesAddress: null,
                bribeAddress: null,
                stateObservedBlock: null,
                stateObservedBlockHash: null
              }]
            };
          }

          async function routes(page) {
            await page.route(/\/api\/vnext\/market-directory(?:\?.*)?$/, async (route) => {
              await route.fulfill({ status: 200, contentType: "application/json", body: JSON.stringify({ canonical: true, coverage: "complete", nextCursor: null, markets: markets.map(canonicalDirectoryMarket), updatedAt: now }) });
            });
            await page.route(/\/api\/markets\/external(?:\?.*)?$/, async (route) => {
              const url = new URL(route.request().url());
              const contract = url.searchParams.get("contract");
              const selected = contract ? markets.filter((item) => item.address.toLowerCase() === contract.toLowerCase()) : markets;
              await route.fulfill({ status: 200, contentType: "application/json", body: JSON.stringify({ markets: selected, source: "visual-fixture", rankingVersion: "visual-v2", thresholds: {}, originCoverage: "complete", rmtOriginCoverage: "complete", stockAssetCoverage: "complete", delayedSources: [], updatedAt: now, stale: false }) });
            });
            await page.route(/\/api\/markets\/ohlcv(?:\?.*)?$/, async (route) => {
              const range = new URL(route.request().url()).searchParams.get("range") ?? "LIVE";
              await route.fulfill({ status: 200, contentType: "application/json", body: JSON.stringify({ token, pair, range, candles: candles(range), source: "GeckoTerminal", updatedAt: now, lastTradeAt: trades[0].timestamp, refreshMs: 60000 }) });
            });
            await page.route(/\/api\/trade\/external-venues(?:\?.*)?$/, (route) => route.fulfill({ status: 200, contentType: "application/json", body: JSON.stringify({ token, venues: [{ venue: "sushi", pair, dexId: "sushiswap", liquidityUsd: markets[0].liquidityUsd, verification: "dex-and-route" }] }) }));
            await page.route(/\/api\/markets\/external-trades(?:\?.*)?$/, (route) => route.fulfill({ status: 200, contentType: "application/json", body: JSON.stringify(tradePayload) }));
            await page.route(/\/api\/markets\/external-stream(?:\?.*)?$/, (route) => route.fulfill({ status: 204, body: "" }));
            await page.route(/\/api\/markets\/token-risk(?:\?.*)?$/, (route) => route.fulfill({ status: 200, contentType: "application/json", body: JSON.stringify(riskPayload) }));
          }

          async function context(browser, options) {
            const created = await browser.newContext(options);
            await created.addInitScript(() => {
              localStorage.setItem("rmt:trading-terms", JSON.stringify({ version: "2026-07-28", acceptedAt: new Date().toISOString() }));
              localStorage.setItem("rmt:experience-preferences", JSON.stringify({ schemaVersion: 1, onboardingVersion: 1, diagnosticsEnabled: false, updatedAt: Date.now() }));
            });
            return created;
          }

          async function audit(page, label) {
            return page.evaluate((name) => {
              const visible = (element) => {
                const style = getComputedStyle(element);
                const rect = element.getBoundingClientRect();
                return style.display !== "none" && style.visibility !== "hidden" && Number(style.opacity) > 0 && rect.width > 0 && rect.height > 0;
              };
              const controls = [...document.querySelectorAll("a,button,input,select,summary")]
                .filter(visible)
                .map((element) => {
                  const rect = element.getBoundingClientRect();
                  return {
                    tag: element.tagName,
                    text: (element.textContent ?? "").trim().slice(0, 60),
                    width: Math.round(rect.width),
                    height: Math.round(rect.height),
                    exempt: Boolean(element.closest(".siteFooter,.universalHeroSocials,.externalIdentityLink"))
                  };
                });
              const tiny = [...document.querySelectorAll("body *")]
                .filter((element) => visible(element) && element.children.length === 0 && (element.textContent ?? "").trim())
                .map((element) => ({ text: (element.textContent ?? "").trim().slice(0, 60), size: Number.parseFloat(getComputedStyle(element).fontSize) }))
                .filter((item) => item.size < 9);
              const signalCard = document.querySelector(".liveSignalRail > a");
              const signalHeight = signalCard && visible(signalCard) ? Math.round(signalCard.getBoundingClientRect().height) : null;
              const heroActions = document.querySelector(".universalHeroActions");
              const heroActionClipped = heroActions && visible(heroActions)
                ? [...heroActions.children].some((child) => child.getBoundingClientRect().right > heroActions.getBoundingClientRect().right + 1)
                : false;
              const community = document.querySelector(".communityLive");
              return {
                label: name,
                viewport: { width: innerWidth, height: innerHeight },
                document: { width: document.documentElement.scrollWidth, height: document.documentElement.scrollHeight },
                horizontalOverflow: Math.max(0, document.documentElement.scrollWidth - innerWidth),
                controlsUnder32: controls.filter((item) => !item.exempt && item.height < 32).slice(0, 30),
                tinyText: tiny.slice(0, 30),
                signalCardHeight: signalHeight,
                heroActionClipped,
                communityVisible: Boolean(community && visible(community))
              };
            }, label);
          }

          async function hideFixedChrome(page, includeTradeDock = false) {
            return page.addStyleTag({
              content: [
                ".publicHeader{display:none!important}",
                ".mobileDock{display:none!important}",
                ".communityLive{display:none!important}",
                ...(includeTradeDock ? [".universalMobileTradeDock,.rmtMobileTradeDock{display:none!important}"] : [])
              ].join("")
            });
          }

          async function capture(options, suffix) {
            const browser = await chromium.launch({ headless: true });
            const ctx = await context(browser, options);
            const page = await ctx.newPage();
            page.setDefaultTimeout(30000);
            await page.emulateMedia({ reducedMotion: "reduce" });
            await routes(page);

            await page.goto(base, { waitUntil: "domcontentloaded", timeout: 60000 });
            const isMobile = suffix === "mobile";
            await page.locator(isMobile ? ".rmtMobileTerminal" : ".rmtDesktopTerminal").waitFor({ state: "visible" });
            const marketRow = page.locator(isMobile ? ".rmtMobileMarketRow" : ".rmtMarketTableRow").first();
            await marketRow.waitFor({ state: "visible" });
            await page.waitForTimeout(1200);
            const homeAudit = await audit(page, `home-${suffix}`);
            await page.screenshot({ path: `${output}/home-${suffix}.png`, fullPage: false, animations: "disabled", timeout: 30000 });
            const homeChrome = await hideFixedChrome(page);
            await page.locator(".rmtVnext").screenshot({ path: `${output}/scanner-${suffix}.png`, animations: "disabled", timeout: 30000 });
            await homeChrome.evaluate((style) => style.remove());

            await marketRow.click();
            await page.locator(isMobile ? ".rmtMobileAssetView" : ".rmtDesktopAssetView").waitFor({ state: "visible" });
            await page.locator(".vnAssetPanel").waitFor({ state: "visible" });
            await page.waitForTimeout(1200);
            const marketAudit = await audit(page, `market-${suffix}`);
            await page.screenshot({ path: `${output}/market-${suffix}.png`, fullPage: false, animations: "disabled", timeout: 30000 });
            const marketChrome = await hideFixedChrome(page, true);
            const chart = page.locator(".vnChartFrame");
            if (await chart.isVisible()) await chart.screenshot({ path: `${output}/chart-${suffix}.png`, animations: "disabled", timeout: 30000 });
            if (isMobile) {
              await marketChrome.evaluate((style) => style.remove());
              await page.locator(".rmtMobileTradeDock .isBuy").click();
              const tradeSheet = page.locator(".rmtMobileTradeSheet");
              await tradeSheet.waitFor({ state: "visible" });
              await tradeSheet.screenshot({ path: `${output}/trade-${suffix}.png`, animations: "disabled", timeout: 30000 });
            } else {
              const tradeRail = page.locator(".vnTradePanel");
              if (await tradeRail.isVisible()) await tradeRail.screenshot({ path: `${output}/trade-${suffix}.png`, animations: "disabled", timeout: 30000 });
              await marketChrome.evaluate((style) => style.remove());
            }
            await browser.close();
            return { homeAudit, marketAudit };
          }

          const desktop = await capture({ viewport: { width: 1440, height: 1000 }, deviceScaleFactor: 1 }, "desktop");
          const mobile = await capture({ ...devices["iPhone 13"] }, "mobile");
          const report = { desktop, mobile };
          await writeFile(`${output}/report.json`, JSON.stringify(report, null, 2));
          const audits = [desktop.homeAudit, desktop.marketAudit, mobile.homeAudit, mobile.marketAudit];
          const overflow = audits.filter((item) => item.horizontalOverflow > 2);
          if (overflow.length) throw new Error(`Horizontal overflow detected: ${JSON.stringify(overflow)}`);
          const clipped = audits.filter((item) => item.heroActionClipped);
          if (clipped.length) throw new Error(`Market hero actions are clipped: ${JSON.stringify(clipped)}`);
          const launchers = audits.filter((item) => item.communityVisible);
          if (launchers.length) throw new Error(`RMT Live overlaps a focused trading surface: ${JSON.stringify(launchers)}`);
          if ((mobile.homeAudit.signalCardHeight ?? 0) > 140) {
            throw new Error(`Mobile signal card is too tall: ${mobile.homeAudit.signalCardHeight}px`);
          }
          const undersized = audits.flatMap((item) => item.controlsUnder32.map((control) => ({ ...control, audit: item.label })));
          if (undersized.length) throw new Error(`Interactive controls under 32px: ${JSON.stringify(undersized)}`);
          SCRIPT
          set +e
          node /tmp/rmt-playwright/terminal-visual.mjs 2>&1 | tee /tmp/terminal-visual-v2.log
          status=${PIPESTATUS[0]}
          echo "--- visual v2 tail ---"
          tail -n 240 /tmp/terminal-visual-v2.log
          echo "--- server tail ---"
          tail -n 120 /tmp/rmt-terminal.log || true
          exit $status
      - name: Upload visual evidence and audit report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: terminal-visual-v2
          path: terminal-visual-v2
          if-no-files-found: warn
          retention-days: 7
