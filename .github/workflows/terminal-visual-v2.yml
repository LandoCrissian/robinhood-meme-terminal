name: Terminal visual v2

on:
  pull_request:
    paths:
      - ".github/workflows/terminal-visual-v2.yml"
      - "apps/web/app/**"
      - "apps/web/lib/**"
      - "scripts/visual-qa/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terminal-visual-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NEXT_PUBLIC_RMT_NETWORK: mainnet
      RMT_VNEXT_SHELL_ENABLED: "true"
      # Match the public signed-out ticket using the existing external SDK boundary.
      # The real PrivyIdentityBridge mounts; no wallet/user/token is injected.
      NEXT_PUBLIC_PRIVY_APP_ID: "privy-acceptance-id-00001"
      NEXT_PUBLIC_RMT_PRIVY_BRIDGE_ACCEPTANCE_PROFILE: "true"
      NEXT_PUBLIC_RMT_VNEXT_AUTHORIZATION_ENABLED: "true"
      RMT_VNEXT_AUTHORIZATION_ENABLED: "true"
      NEXT_PUBLIC_RMT_VNEXT_WALLET_SUBMISSION_ENABLED: "true"
      RMT_VNEXT_PUBLIC_EXECUTION_PROVIDERS: zero-x-swap
      RMT_VNEXT_ZEROX_OBSERVATION_ENABLED: "true"
      RMT_VNEXT_ZEROX_FIRM_QUOTE_VERIFICATION_ENABLED: "true"
      RMT_ZEROX_API_KEY: "visual-only-not-a-provider-credential"
      RMT_ZEROX_ALLOWANCE_HOLDER: "0x0000000000001fF3684f28c67538d4D072C22734"
      RMT_ZEROX_ALLOWANCE_HOLDER_CODE_HASH: "0x1111111111111111111111111111111111111111111111111111111111111111"
      RMT_NFT_MINT_EXECUTION_ENABLED: "false"
      NEXT_PUBLIC_RMT_NFT_MINT_EXECUTION_ENABLED: "false"
      RMT_MARKET_INDEXER_URL: http://127.0.0.1:43112
      RMT_MARKET_INDEXER_READ_TOKEN: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
      NFT_INDEXER_URL: http://127.0.0.1:43111
      NFT_MARKETPLACE_INDEXER_URL: http://127.0.0.1:43111
      NFT_MINT_RADAR_OPENSEA_API_KEY: legion-radar-fixture
      NFT_MINT_RADAR_OPENSEA_BASE_URL: http://127.0.0.1:43111
      NFT_MINT_RADAR_RPC_URL: http://127.0.0.1:43111/rpc
      NFT_MINT_RADAR_REVIEWED_SEADROP_DEPLOYMENTS: 0x5555555555555555555555555555555555555555@0xbc36789e7a1e281436464229828f817d6612f7b477d66591ff96a9e064bcc98a
      RMT_VISUAL_BASE_URL: http://127.0.0.1:3000
      RMT_VISUAL_OUTPUT: terminal-visual-v2
      RMT_REVIEWED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      RMT_VISUAL_FIXTURE_NOW: "2026-09-21T20:30:00.000Z"
      RMT_NFT_MINT_RADAR_FIXTURE_NOW: "2026-09-21T20:30:00.000Z"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
        with:
          version: 10.12.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Verify Token fixture authority
        run: pnpm --filter web exec tsx ../../scripts/visual-qa/legion-token-fixture-authority-smoke.ts
      - name: Verify evidence-backed asset chassis and plot composition
        run: pnpm --filter web exec tsx lib/vnext/asset-chassis-smoke.ts
      - run: pnpm build
      - name: Start production build
        run: |
          fixture_read_token=$(printf 'a%.0s' {1..64})
          export NFT_INDEXER_READ_TOKEN="$fixture_read_token"
          export NFT_MARKETPLACE_INDEXER_READ_TOKEN="$fixture_read_token"
          nohup pnpm --filter web exec next start -p 3000 > /tmp/rmt-terminal.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/ >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/rmt-terminal.log
          exit 1
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Render deterministic Token and NFT evidence
        run: node scripts/visual-qa/legion-visual-qa.mjs --capture-only
      - name: Verify chart failure and recovery preserve the public workspace
        run: node scripts/visual-qa/chart-refresh-stability.mjs
      - name: Verify full asset chassis at four viewports
        run: node scripts/visual-qa/asset-chassis-acceptance.mjs
      - name: Verify real Project discovery, search, navigation and isolated enrichment
        run: node scripts/visual-qa/project-graph-acceptance.mjs
      - name: Verify Project artwork, NFT-led composition and degraded-state continuity
        run: node scripts/visual-qa/project-product-acceptance.mjs
      - name: Verify durable launch discovery and exact-token navigation
        if: ${{ !cancelled() }}
        run: node scripts/visual-qa/launch-intelligence-acceptance.mjs
      - name: Include public before capture manifests
        if: always()
        run: cp -R docs/product/asset-chassis/before terminal-visual-v2/before-public
      - name: Verify live scanner refresh, reconciliation and focus continuity
        if: ${{ !cancelled() }}
        run: node scripts/visual-qa/live-scanner-acceptance.mjs
      - name: Include discovery evidence
        if: always()
        run: cp docs/product/market-discovery-v2-review.md terminal-visual-v2/market-discovery-v2-review.md
      - name: Upload visual evidence and semantic report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: terminal-visual-v2
          path: terminal-visual-v2
          if-no-files-found: warn
          retention-days: 7
