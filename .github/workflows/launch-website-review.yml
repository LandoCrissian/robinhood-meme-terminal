name: Read-only launch website

on:
  pull_request:
    paths:
      - "apps/launch-website/**"
      - "apps/web/app/**/*.css"
      - "apps/web/public/brand/rmt-master-logo.png"
      - "netlify.toml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "patches/**"
      - "apps/indexer/src/curve-*.ts"
      - "apps/indexer/package.json"
      - "scripts/visual-qa/rmt-creator-integration.mjs"
      - "scripts/visual-qa/rmt-netlify-website.mjs"
      - ".github/workflows/launch-website-review.yml"

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      RMT_CURVE_ENABLED: "true"
      RMT_LAUNCHPAD_ENABLED: "true"
      NEXT_PUBLIC_RMT_NETWORK: mainnet
      RMT_WEBSITE_PREVIEW_SECRET_MARKER: rmt-website-synthetic-secret-027
      RMT_LAUNCH_HISTORY_INDEXER_READ_TOKEN: rmt-website-synthetic-secret-027
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a
        with:
          version: 10.12.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile --filter @rmt/launch-website... --filter robinhood-meme-terminal
      - run: pnpm --filter @rmt/launch-website test:history
      - run: pnpm --filter @rmt/launch-website build
      - run: pnpm exec playwright install --with-deps chromium webkit
      - name: Verify website navigation and read-only HTTP boundary
        run: |
          set -euo pipefail
          export RMT_WEBSITE_PREVIEW_ARTIFACTS="$RUNNER_TEMP/rmt-website-preview"
          mkdir "$RMT_WEBSITE_PREVIEW_ARTIFACTS"
          node apps/launch-website/node_modules/next/dist/bin/next start apps/launch-website \
            --hostname 127.0.0.1 --port 3205 > "$RMT_WEBSITE_PREVIEW_ARTIFACTS/next.log" 2>&1 &
          child="$!"
          trap 'kill "$child" 2>/dev/null || true; wait "$child" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent --max-time 3 http://127.0.0.1:3205/api/launchpad/config | grep -q '"status":"disabled"'; then
              break
            fi
            [[ "$attempt" != 30 ]] || { echo "Website preview did not become ready." >&2; exit 1; }
            sleep 1
          done
          for engine in chromium webkit; do
            RMT_WEBSITE_BROWSER="$engine" \
              RMT_WEBSITE_PREVIEW_ARTIFACTS="$RMT_WEBSITE_PREVIEW_ARTIFACTS/$engine" \
              node scripts/visual-qa/rmt-netlify-website.mjs
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: rmt-website-preview-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/rmt-website-preview

  isolated-lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      CANDIDATE_SHA: 8dca5773cbd4dc98f52a45616f420bce96b000f0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a
        with:
          version: 10.12.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - uses: foundry-rs/foundry-toolchain@b00af27efadbc7b4ca8b82abbd903b17cc874d2a
        with:
          version: "1.7.1"
      - name: Build the website and isolated worker
        run: |
          pnpm install --frozen-lockfile --filter @rmt/launch-website... --filter indexer --filter robinhood-meme-terminal
          pnpm --filter @rmt/launch-website build
          pnpm --filter indexer build
          pnpm exec playwright install --with-deps chromium
      - name: Prepare the pinned candidate and check local PostgreSQL binaries
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$CANDIDATE_SHA"
          git worktree add --detach "$RUNNER_TEMP/curve-candidate" "$CANDIDATE_SHA"
          pnpm --dir "$RUNNER_TEMP/curve-candidate" install --frozen-lockfile --filter web...
          (cd "$RUNNER_TEMP/curve-candidate/packages/contracts" && bash scripts/install-v4-deps.sh)
          curl --fail --silent --show-error --retry 2 \
            'https://binaries.soliditylang.org/linux-amd64/solc-linux-amd64-v0.8.26+commit.8a97fa7a' \
            --output "$RUNNER_TEMP/solc-0.8.26"
          chmod 700 "$RUNNER_TEMP/solc-0.8.26"
          "$(pg_config --bindir)/pg_ctl" --version
      - name: Verify the same-app lifecycle on synthetic chain 31337
        run: |
          node scripts/visual-qa/rmt-creator-integration.mjs \
            --candidate "$RUNNER_TEMP/curve-candidate" --anvil "$(command -v anvil)" \
            --solc "$RUNNER_TEMP/solc-0.8.26" --pg-bin "$(pg_config --bindir)" \
            --output "$RUNNER_TEMP/rmt-creator-lifecycle"
      - name: Read local PostgreSQL diagnostics after failure
        if: failure()
        run: |
          for name in postgres-init postgres-start postgres; do
            file="$RUNNER_TEMP/rmt-creator-lifecycle/$name.log"
            if [ -f "$file" ]; then tail -n 20 "$file"; fi
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: rmt-creator-lifecycle-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/rmt-creator-lifecycle/*.png
            ${{ runner.temp }}/rmt-creator-lifecycle/creation-journey-evidence.json
