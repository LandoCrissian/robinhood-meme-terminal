name: Read-only launch website

on:
  pull_request:
    paths:
      - "apps/launch-website/**"
      - "packages/contracts/**"
      - "packages/launchpad-common/**"
      - "scripts/production-readiness/**"
      - "netlify.toml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "apps/indexer/src/curve-*.ts"
      - "apps/indexer/src/production-claim*.ts"
      - "apps/indexer/src/project-treasury*.ts"
      - "apps/indexer/src/reclaim*.ts"
      - "apps/indexer/package.json"
      - "apps/indexer/tsconfig.json"
      - "scripts/visual-qa/rmt-creator-integration.mjs"
      - "scripts/visual-qa/receipt-observation.mjs"
      - "scripts/visual-qa/receipt-observation.test.mjs"
      - "scripts/visual-qa/rmt-earnings-integration.mjs"
      - "scripts/visual-qa/rmt-successor-earnings-integration.mjs"
      - "scripts/visual-qa/rmt-mobile-review.mjs"
      - "scripts/visual-qa/rmt-mobile-connection-check.mjs"
      - "scripts/visual-qa/export-mobile-connection-check.mjs"
      - "scripts/visual-qa/export-rmt-private-phone-review.mjs"
      - "scripts/visual-qa/rmt-private-phone-review-page.mjs"
      - "scripts/visual-qa/test-rmt-private-phone-review.mjs"
      - "scripts/visual-qa/export-rmt-owner-safe.mjs"
      - "scripts/visual-qa/rmt-owner-safe-page.mjs"
      - "scripts/visual-qa/test-rmt-owner-safe.mjs"
      - "scripts/visual-qa/export-rmt-owner-protocol.mjs"
      - "scripts/visual-qa/test-rmt-owner-protocol.mjs"
      - "scripts/visual-qa/export-rmt-owner-protocol-stage.mjs"
      - "scripts/visual-qa/test-rmt-owner-protocol-stage.mjs"
      - "scripts/visual-qa/export-rmt-governance-review.mjs"
      - "scripts/visual-qa/rmt-governance-review-page.mjs"
      - "scripts/visual-qa/test-rmt-governance-review.mjs"
      - "scripts/visual-qa/export-rmt-owner-governance.mjs"
      - "scripts/visual-qa/test-rmt-owner-governance.mjs"
      - "scripts/visual-qa/rmt-netlify-website.mjs"
      - "scripts/visual-qa/rmt-earnings-public.mjs"
      - "scripts/claims/**"
      - "scripts/treasury/**"
      - "scripts/treasury-v2/**"
      - "scripts/reclaim/**"
      - "scripts/reclaim-v2/**"
      - "scripts/visual-qa/rmt-polish.mjs"
      - "docs/evidence/mobile-signing/**"
      - ".github/workflows/launch-website-review.yml"
      - ".github/scripts/prepare-browser-apt.sh"
      - ".github/scripts/prepare-postgres-18.sh"
      - ".github/scripts/postgres-18-packages.mjs"

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      RMT_CURVE_ENABLED: "true"
      RMT_LAUNCHPAD_ENABLED: "true"
      NEXT_PUBLIC_RMT_NETWORK: mainnet
      RMT_WEBSITE_PREVIEW_SECRET_MARKER: rmt-website-synthetic-secret-027
      RMT_LAUNCH_HISTORY_INDEXER_READ_TOKEN: rmt-website-synthetic-secret-027
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a
        with:
          version: 10.12.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile --filter @rmt/launch-website... --filter robinhood-meme-terminal
      - run: pnpm --filter @rmt/launch-website test:history
      - run: pnpm --filter @rmt/launch-website build
      - name: Use the signed Ubuntu archive over HTTPS for browser dependencies
        run: bash .github/scripts/prepare-browser-apt.sh
      - run: pnpm exec playwright install --with-deps chromium webkit
      - name: Syntax-check retained historical V1 browser evidence (not active acceptance)
        run: node --check scripts/reclaim/browser-public.mjs
      - name: Verify website navigation and read-only HTTP boundary
        run: |
          set -euo pipefail
          export RMT_WEBSITE_PREVIEW_ARTIFACTS="$RUNNER_TEMP/rmt-website-preview"
          mkdir "$RMT_WEBSITE_PREVIEW_ARTIFACTS"
          node scripts/visual-qa/rmt-mobile-connection-check.mjs
          node scripts/visual-qa/test-rmt-private-phone-review.mjs
          pnpm test:owner-wallet
          pnpm test:owner-protocol
          pnpm test:owner-protocol-stage
          pnpm test:governance-review
          pnpm test:owner-governance
          node apps/launch-website/node_modules/next/dist/bin/next start apps/launch-website \
            --hostname 127.0.0.1 --port 3205 > "$RMT_WEBSITE_PREVIEW_ARTIFACTS/next.log" 2>&1 &
          child="$!"
          trap 'kill "$child" 2>/dev/null || true; wait "$child" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent --max-time 3 http://127.0.0.1:3205/api/launchpad/config | grep -q '"status":"disabled"'; then
              break
            fi
            [[ "$attempt" != 30 ]] || { echo "Website preview did not become ready." >&2; exit 1; }
            sleep 1
          done
          for engine in chromium webkit; do
            RMT_WEBSITE_BROWSER="$engine" \
              RMT_WEBSITE_PREVIEW_ARTIFACTS="$RMT_WEBSITE_PREVIEW_ARTIFACTS/$engine" \
              node scripts/visual-qa/rmt-netlify-website.mjs
            RMT_WEBSITE_BROWSER="$engine" \
              RMT_WEBSITE_PREVIEW_ARTIFACTS="$RMT_WEBSITE_PREVIEW_ARTIFACTS/$engine/earnings" \
              node scripts/visual-qa/rmt-earnings-public.mjs
            node scripts/treasury-v2/browser-capability.mjs --url http://127.0.0.1:3205/ \
              --browser "$engine" --output "$RMT_WEBSITE_PREVIEW_ARTIFACTS/$engine/purchase-capability"
            node scripts/reclaim-v2/browser-public.mjs --url http://127.0.0.1:3205/ \
              --browser "$engine" --output "$RMT_WEBSITE_PREVIEW_ARTIFACTS/$engine/reclaim"
            node scripts/nft-acquisition/browser-public.mjs --url http://127.0.0.1:3205/ \
              --browser "$engine" --output "$RMT_WEBSITE_PREVIEW_ARTIFACTS/$engine/nft-acquisition"
          done
          RMT_POLISH_URL=http://127.0.0.1:3205/ \
            RMT_POLISH_ARTIFACTS="$RMT_WEBSITE_PREVIEW_ARTIFACTS/polish" pnpm test:polish
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: rmt-website-preview-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/rmt-website-preview

  isolated-lifecycle:
    runs-on: ubuntu-24.04
    # The existing lifecycle suites plus genuine two-owner Safe approval,
    # outer-wallet review and recovery run sequentially in each browser.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      HISTORICAL_ANCHOR_SHA: 8dca5773cbd4dc98f52a45616f420bce96b000f0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a
        with:
          version: 10.12.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - uses: foundry-rs/foundry-toolchain@b00af27efadbc7b4ca8b82abbd903b17cc874d2a
        with:
          version: "1.7.1"
      - name: Build the website and isolated worker
        run: |
          bash .github/scripts/prepare-browser-apt.sh
          pnpm install --frozen-lockfile --filter @rmt/launch-website... --filter indexer --filter robinhood-meme-terminal
          pnpm --filter @rmt/launch-website build
          pnpm --filter indexer build
          pnpm exec playwright install --with-deps chromium webkit
      - name: Prepare the fixed-supply candidate and local tools
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$HISTORICAL_ANCHOR_SHA"
          (cd packages/contracts && bash scripts/install-v4-deps.sh)
          curl --fail --silent --show-error --retry 2 \
            'https://binaries.soliditylang.org/linux-amd64/solc-linux-amd64-v0.8.26+commit.8a97fa7a' \
            --output "$RUNNER_TEMP/solc-0.8.26"
          chmod 700 "$RUNNER_TEMP/solc-0.8.26"
          node packages/contracts/scripts/mobile-review-plan.mjs --solc "$RUNNER_TEMP/solc-0.8.26" \
            --fixture-lifecycle --verify docs/evidence/mobile-signing/review-plan-4663.json
      - name: Prepare exact PostgreSQL 18.6 isolated fixture binaries
        run: bash .github/scripts/prepare-postgres-18.sh
      - name: Verify permanent Reclaim and two-owner Safe execution on synthetic chain 31337
        run: |
          node scripts/visual-qa/rmt-creator-integration.mjs --reclaim-only \
            --anvil "$(command -v anvil)" \
            --solc "$RUNNER_TEMP/solc-0.8.26" --pg-bin "$RMT_PG18_BIN" \
            --browser "${{ matrix.browser }}" \
            --output "$RUNNER_TEMP/rmt-reclaim"
      - name: Verify the same-app lifecycle on synthetic chain 31337
        run: |
          node --test scripts/visual-qa/receipt-observation.test.mjs
          node scripts/visual-qa/rmt-creator-integration.mjs \
            --anvil "$(command -v anvil)" \
            --solc "$RUNNER_TEMP/solc-0.8.26" --pg-bin "$RMT_PG18_BIN" \
            --mobile-plan docs/evidence/mobile-signing/review-plan-4663.json \
            --browser "${{ matrix.browser }}" \
            --output "$RUNNER_TEMP/rmt-creator-lifecycle"
      - name: Verify profiled claim preparation, Safe execution and canonical recovery in the same app
        run: |
          node scripts/visual-qa/rmt-creator-integration.mjs --profiles-only \
            --anvil "$(command -v anvil)" \
            --solc "$RUNNER_TEMP/solc-0.8.26" --pg-bin "$RMT_PG18_BIN" \
            --browser "${{ matrix.browser }}" \
            --output "$RUNNER_TEMP/rmt-claim-wallet-profiles"
      - name: Verify optional treasury lifecycle and hard-disabled V2 purchase boundary
        run: |
          node scripts/visual-qa/rmt-creator-integration.mjs --treasury-only --treasury-v2 \
            --anvil "$(command -v anvil)" \
            --solc "$RUNNER_TEMP/solc-0.8.26" --pg-bin "$RMT_PG18_BIN" \
            --browser "${{ matrix.browser }}" \
            --output "$RUNNER_TEMP/rmt-project-treasury"
      - name: Read local PostgreSQL diagnostics after failure
        if: failure()
        run: |
          for scope in rmt-reclaim rmt-creator-lifecycle rmt-claim-wallet-profiles rmt-project-treasury; do
            for name in postgres-init postgres-start postgres-stop postgres; do
              file="$RUNNER_TEMP/$scope/$name.log"
              if [ -f "$file" ]; then
                printf 'PostgreSQL diagnostic: %s/%s.log\n' "$scope" "$name"
                tail -n 20 "$file"
              fi
            done
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: rmt-creator-lifecycle-${{ matrix.browser }}-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ env.RMT_PG18_EVIDENCE }}/provenance.json
            ${{ env.RMT_PG18_EVIDENCE }}/versions-and-runtime.txt
            ${{ env.RMT_PG18_EVIDENCE }}/InRelease
            ${{ env.RMT_PG18_EVIDENCE }}/Release
            ${{ env.RMT_PG18_EVIDENCE }}/Packages.gz
            ${{ env.RMT_PG18_EVIDENCE }}/ubuntu-*
            ${{ env.RMT_PG18_EVIDENCE }}/*.ldd
            ${{ runner.temp }}/rmt-reclaim/postgres-init.log
            ${{ runner.temp }}/rmt-reclaim/postgres-start.log
            ${{ runner.temp }}/rmt-reclaim/postgres-stop.log
            ${{ runner.temp }}/rmt-reclaim/postgres.log
            ${{ runner.temp }}/rmt-creator-lifecycle/postgres-init.log
            ${{ runner.temp }}/rmt-creator-lifecycle/postgres-start.log
            ${{ runner.temp }}/rmt-creator-lifecycle/postgres-stop.log
            ${{ runner.temp }}/rmt-creator-lifecycle/postgres.log
            ${{ runner.temp }}/rmt-claim-wallet-profiles/postgres-init.log
            ${{ runner.temp }}/rmt-claim-wallet-profiles/postgres-start.log
            ${{ runner.temp }}/rmt-claim-wallet-profiles/postgres-stop.log
            ${{ runner.temp }}/rmt-claim-wallet-profiles/postgres.log
            ${{ runner.temp }}/rmt-project-treasury/postgres-init.log
            ${{ runner.temp }}/rmt-project-treasury/postgres-start.log
            ${{ runner.temp }}/rmt-project-treasury/postgres-stop.log
            ${{ runner.temp }}/rmt-project-treasury/postgres.log
            ${{ runner.temp }}/rmt-creator-lifecycle/*.png
            ${{ runner.temp }}/rmt-creator-lifecycle/creation-journey-evidence.json
            ${{ runner.temp }}/rmt-creator-lifecycle/graduation-review-evidence.json
            ${{ runner.temp }}/rmt-creator-lifecycle/receipt-observations.json
            ${{ runner.temp }}/rmt-creator-lifecycle/earnings-journey-evidence.json
            ${{ runner.temp }}/rmt-creator-lifecycle/successor-earnings-evidence.json
            ${{ runner.temp }}/rmt-creator-lifecycle/failure-page.txt
            ${{ runner.temp }}/rmt-creator-lifecycle/website*.log
            ${{ runner.temp }}/rmt-creator-lifecycle/worker*.log
            ${{ runner.temp }}/rmt-claim-wallet-profiles/*.png
            ${{ runner.temp }}/rmt-claim-wallet-profiles/claim-wallet-acceptance.json
            ${{ runner.temp }}/rmt-claim-wallet-profiles/claim-wallet-profile-manifest.json
            ${{ runner.temp }}/rmt-claim-wallet-profiles/claim-wallet-browser-evidence.json
            ${{ runner.temp }}/rmt-claim-wallet-profiles/claim-wallet-browser-failure.txt
            ${{ runner.temp }}/rmt-project-treasury/*.png
            ${{ runner.temp }}/rmt-project-treasury/project-treasury-acceptance.json
            ${{ runner.temp }}/rmt-project-treasury/project-treasury-browser-evidence.json
            ${{ runner.temp }}/rmt-project-treasury/project-treasury-compiler-manifest.json
            ${{ runner.temp }}/rmt-project-treasury/project-treasury-deployment.json
            ${{ runner.temp }}/rmt-project-treasury/purchase-v2-acceptance.json
            ${{ runner.temp }}/rmt-reclaim/*.png
            ${{ runner.temp }}/rmt-reclaim/reclaim-acceptance.json
            ${{ runner.temp }}/rmt-reclaim/reclaim-browser-evidence.json
            ${{ runner.temp }}/rmt-reclaim/reclaim-compiler-manifest.json
            ${{ runner.temp }}/rmt-reclaim/reclaim-deployment.json
            ${{ runner.temp }}/rmt-reclaim/reclaim-administration-policy.json
            ${{ runner.temp }}/rmt-reclaim/reclaim-safe-acceptance.json
            ${{ runner.temp }}/rmt-reclaim/reclaim-safe-browser-evidence.json
            ${{ runner.temp }}/rmt-reclaim/reclaim-safe-browser-failure.txt
            ${{ runner.temp }}/rmt-reclaim/safe-browser/*.png
            ${{ runner.temp }}/rmt-reclaim/safe-browser/reclaim-browser-evidence.json
            ${{ runner.temp }}/rmt-reclaim/reclaim-setup.json
            ${{ runner.temp }}/rmt-reclaim/budget-browser/*.png
            ${{ runner.temp }}/rmt-reclaim/budget-browser/reclaim-browser-evidence.json
            ${{ runner.temp }}/rmt-reclaim/reclaim-browser-failure.txt
            ${{ runner.temp }}/rmt-reclaim/website*.log
            ${{ runner.temp }}/rmt-reclaim/worker*.log
