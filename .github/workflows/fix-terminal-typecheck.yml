name: Fix terminal typecheck

on:
  pull_request:
    paths:
      - ".github/workflows/fix-terminal-typecheck.yml"

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/terminal-rebuild
          fetch-depth: 0
      - name: Accept untrusted system-status strings without unsafe narrowing
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web/app/live-position-guard-controls.tsx')
          source = path.read_text()
          old = '  systemStatus?: "ready" | "release_locked" | "worker_offline" | "unverified";'
          new = '  systemStatus?: string;'
          if old not in source:
              raise SystemExit('Expected LiveGuardStatus systemStatus declaration was not found.')
          path.write_text(source.replace(old, new, 1))
          PY
      - name: Commit the focused correction and remove this one-shot workflow
        run: |
          git rm .github/workflows/fix-terminal-typecheck.yml
          git add apps/web/app/live-position-guard-controls.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(web): avoid unsafe status narrowing in guard recovery"
          git push origin HEAD:feat/terminal-rebuild
