name: Observe the published owner sign-in on macOS
on:
  push:
    branches:
      - rmt-hosted-6910b879
    paths:
      - .github/workflows/rmt-hosted-owner-observation.yml
      - .github/scripts/rmt-hosted-owner-observation.mjs

permissions:
  contents: read

jobs:
  hosted-wallet-browsers:
    runs-on: macos-15
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a
        with:
          version: 10.12.1
      - run: pnpm install --frozen-lockfile --ignore-scripts --filter . --filter @rmt/launch-website...
      - run: pnpm exec playwright install webkit chromium
      - name: Check the hosted form up to the owner signature prompt
        run: node .github/scripts/rmt-hosted-owner-observation.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: hosted-owner-nonspending-observation
          path: ${{ runner.temp }}/hosted-owner-acceptance.json
