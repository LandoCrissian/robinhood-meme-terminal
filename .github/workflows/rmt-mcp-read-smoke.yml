name: RMT MCP Read Smoke

on:
  push:
    branches:
      - codex/agent-engine-foundation
    paths:
      - "apps/rmt-mcp/**"
      - "apps/agent-engine/src/paper-arena-public-read-model.ts"
      - "apps/agent-engine/src/paper-arena-authoritative-matchup.ts"
      - "apps/agent-engine/src/paper-arena-matchup.ts"
      - "apps/agent-engine/src/paper-arena-net-leaderboard.ts"
      - "packages/agent-core/src/**"
      - ".github/workflows/rmt-mcp-read-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run read-only MCP smoke
        run: node --experimental-strip-types apps/rmt-mcp/src/smoke.ts
