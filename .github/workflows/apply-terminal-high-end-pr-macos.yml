name: Apply terminal high-end PR pass macOS

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/apply-terminal-high-end-pr-macos.yml"

permissions:
  contents: write

concurrency:
  group: apply-terminal-high-end-final-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.head_ref == 'fix/terminal-desktop-layout-v9'
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/terminal-desktop-layout-v9
          fetch-depth: 0
      - name: Execute staged terminal patch
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin fix/terminal-desktop-layout-v9
          python3 <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/apply-terminal-high-end-pass.yml').read_text()
          marker = "          python3 <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          raw_lines = workflow[start:end].splitlines()
          normalized = []
          quote = None
          for line in raw_lines:
              output = line if quote else (line[10:] if line.startswith("          ") else line)
              normalized.append(output)
              for token in ("'''", '"""'):
                  occurrences = output.count(token)
                  if quote is None and occurrences % 2 == 1:
                      quote = token
                      break
                  if quote == token and occurrences % 2 == 1:
                      quote = None
                      break
          script = "\n".join(normalized)
          exec(compile(script, 'terminal-high-end-pass.py', 'exec'))
          PY

          rm -f \
            .github/workflows/apply-terminal-high-end-pass.yml \
            .github/workflows/apply-terminal-high-end-pr.yml \
            .github/workflows/apply-terminal-high-end-pr-macos.yml \
            .github/workflows/run-terminal-high-end-pass.yml \
            .github/workflows/export-terminal-source.yml \
            .terminal-high-end-trigger
          git diff --check
          git status --short
      - name: Commit completed terminal pass
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "rmt-terminal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat(web): complete high-end terminal workstation pass"
          git push origin HEAD:fix/terminal-desktop-layout-v9
