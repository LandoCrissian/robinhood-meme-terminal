name: CCFF00 public TBA read-only audit

on:
  push:
    branches:
      - research/ccff00-tba-probe
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Install isolated probe dependency
        run: |
          mkdir -p /tmp/ccff00-probe
          cd /tmp/ccff00-probe
          npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund viem@2.55.5
          ln -s /tmp/ccff00-probe/node_modules "$GITHUB_WORKSPACE/node_modules"
      - name: Audit public CCFF00 token-bound accounts
        run: node scripts/ccff00-public-tba-audit.mjs
      - name: Archive public read-only audit
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ccff00-public-tba-audit
          path: |
            tmp/ccff00-public-tba-audit.json
            tmp/ccff00-public-tba-audit.csv
          if-no-files-found: warn
          retention-days: 7
