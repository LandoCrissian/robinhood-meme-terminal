name: Terminal visual capture

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/terminal-visual-capture.yml"
      - "apps/web/app/**"
      - "apps/web/lib/**"

permissions:
  contents: read

concurrency:
  group: terminal-visual-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NEXT_PUBLIC_RMT_NETWORK: mainnet
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
        with:
          version: 10.12.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Install and build the exact pull-request source
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Start the built terminal locally
        run: |
          nohup pnpm --filter web exec next start -p 3000 > /tmp/rmt-terminal.log 2>&1 &
          echo $! > /tmp/rmt-terminal.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/rmt-terminal.log
          exit 1
      - name: Install isolated deterministic browser runtime
        run: |
          mkdir -p /tmp/terminal-playwright terminal-captures
          cd /tmp/terminal-playwright
          npm init -y
          npm install --save-exact --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Capture deterministic desktop and mobile product surfaces
        run: |
          cat > /tmp/terminal-playwright/capture-terminal.mjs <<'SCRIPT'
          import { chromium, devices } from "playwright";
          import { writeFile } from "node:fs/promises";

          const base = "http://127.0.0.1:3000";
          const output = `${process.env.GITHUB_WORKSPACE}/terminal-captures`;
          if (!process.env.GITHUB_WORKSPACE) throw new Error("GITHUB_WORKSPACE is required.");

          const TOKEN = "0x1111111111111111111111111111111111111111";
          const PAIR = "0x2222222222222222222222222222222222222222";
          const FACTORY = "0x3333333333333333333333333333333333333333";
          const CREATOR = "0x4444444444444444444444444444444444444444";
          const TX = `0x${"a".repeat(64)}`;
          const EVIDENCE = `0x${"b".repeat(64)}`;
          const nowIso = new Date().toISOString();

          function address(seed) {
            return `0x${seed.toString(16).padStart(40, "0")}`;
          }

          function fixtureMarket(index, overrides = {}) {
            const token = index === 1 ? TOKEN : address(0x1000 + index);
            const pair = index === 1 ? PAIR : address(0x2000 + index);
            const symbols = ["", "RUNE", "NOVA", "PULSE", "MOSS", "ARC", "TIDE"];
            const names = ["", "Rune Market", "Nova Signal", "Pulse Engine", "Moss Protocol", "Arc Runner", "Tide Network"];
            const prices = [0, 0.001842, 0.000092, 0.00831, 0.000441, 0.0248, 0.0000162];
            const changes = [0, 18.62, 6.14, -3.48, 2.31, 32.9, -1.62];
            const sourceId = index % 3 === 0 ? "pons" : index % 3 === 1 ? "sushi" : "lemon";
            const sourceName = sourceId === "pons" ? "Pons" : sourceId === "sushi" ? "Sushi Launch" : "Lemon";
            return {
              address: token,
              name: names[index],
              symbol: symbols[index],
              pairAddress: pair,
              url: `https://robinhoodchain.blockscout.com/address/${pair}`,
              dexId: index % 2 === 0 ? "uniswap-v3" : "sushiswap",
              project: {
                sourceId,
                sourceName,
                provenance: sourceId === "sushi"
                  ? "public-api-and-dex-pool-cross-checked"
                  : "factory-and-token-cross-checked",
                creator: CREATOR,
                launchPool: pair,
                name: names[index],
                symbol: symbols[index],
                description: "Deterministic market fixture used only for rendered terminal regression review.",
                imageUri: null,
                socials: {
                  x: "https://x.com/RMTLaunch",
                  telegram: null,
                  discord: null,
                  website: "https://www.rmtlaunch.fun",
                  farcaster: null
                }
              },
              socials: {
                x: "https://x.com/RMTLaunch",
                telegram: null,
                discord: null,
                website: "https://www.rmtlaunch.fun",
                farcaster: null,
                provenance: "dex-pair-metadata"
              },
              origin: {
                kind: "external",
                state: "attributed",
                sourceId,
                sourceName,
                coverage: "complete",
                claim: {
                  claimKind: "token-created",
                  sourceId,
                  sourceName,
                  factory: FACTORY,
                  transactionHash: TX,
                  blockNumber: String(12_345_000 + index),
                  evidenceHash: EVIDENCE
                }
              },
              venue: {
                kind: "dex",
                dexId: index % 2 === 0 ? "uniswap-v3" : "sushiswap",
                pairAddress: pair,
                url: `https://robinhoodchain.blockscout.com/address/${pair}`,
                execution: "read-only"
              },
              priceUsd: prices[index],
              liquidityUsd: 38_000 + index * 31_000,
              marketCapUsd: 210_000 + index * 260_000,
              fdvUsd: 250_000 + index * 310_000,
              volume5m: 2_900 + index * 1_350,
              volume1h: 31_000 + index * 9_700,
              volume24h: 280_000 + index * 112_000,
              priceChange5m: changes[index] / 4,
              priceChange1h: changes[index],
              priceChange24h: changes[index] * 2.1,
              buys5m: 16 + index * 4,
              sells5m: 7 + index * 2,
              buys1h: 102 + index * 19,
              sells1h: 61 + index * 11,
              buys24h: 880 + index * 103,
              sells24h: 516 + index * 71,
              pairCreatedAt: Date.now() - index * 5_400_000,
              ageMinutes: 85 + index * 190,
              momentumScore: 68 + index * 5,
              buyPressureBps: 6_180 + index * 170,
              signal: changes[index] > 12 ? "moving" : index < 3 ? "early" : "active",
              riskFlags: index === 6 ? ["thin-liquidity"] : [],
              ...overrides
            };
          }

          const markets = Array.from({ length: 6 }, (_, offset) => fixtureMarket(offset + 1));
          const primaryMarket = markets[0];

          function candles(range) {
            const count = range === "7D" ? 84 : range === "24H" ? 72 : 36;
            const step = range === "7D" ? 7_200 : range === "24H" ? 1_200 : 60;
            const start = Math.floor(Date.now() / 1_000) - count * step;
            return Array.from({ length: count }, (_, index) => {
              const drift = index * 0.000012;
              const wave = Math.sin(index / 3.2) * 0.000055;
              const close = 0.00132 + drift + wave;
              const open = close - Math.cos(index / 2.8) * 0.000021;
              return {
                timestamp: start + index * step,
                open,
                high: Math.max(open, close) + 0.000028,
                low: Math.min(open, close) - 0.000024,
                close,
                volume: 3_200 + Math.abs(Math.sin(index / 2)) * 9_600
              };
            });
          }

          const trades = Array.from({ length: 10 }, (_, index) => ({
            id: `fixture-trade-${index}`,
            transactionHash: `0x${(index + 10).toString(16).repeat(64).slice(0, 64)}`,
            trader: address(0x5000 + (index % 5)),
            side: index % 3 === 0 ? "sell" : "buy",
            tokenAmount: 120_000 + index * 18_000,
            quoteAmount: 0.11 + index * 0.018,
            priceUsd: 0.00172 + index * 0.000011,
            volumeUsd: 480 + index * 235,
            timestamp: new Date(Date.now() - index * 27_000).toISOString()
          }));

          const tradePayload = {
            token: TOKEN,
            pair: PAIR,
            source: "GeckoTerminal",
            updatedAt: nowIso,
            trades
          };

          const riskPayload = {
            token: TOKEN,
            pair: PAIR,
            marketVerified: true,
            coverage: "complete",
            contract: {
              sourcePublished: true,
              isProxy: false,
              bytecodeChanged: false,
              controls: {
                assessment: "no-common-controls-found",
                detected: [],
                customWriteFunctions: [],
                administrator: null,
                activeLaunchRestrictions: false,
                restrictionEndBlock: null,
                maxTransactionBps: null,
                maxWalletBps: null
              }
            },
            liquidity: {
              controlStatus: "contract-held",
              evidenceSource: "launchpad-registry",
              positionManager: FACTORY,
              positionId: "1842",
              owner: FACTORY,
              approvedOperator: null,
              creatorCanTransfer: false,
              positionLiquidity: "842000000000000000000"
            },
            holders: {
              count: 1_842,
              poolShareBps: 4_200,
              topNonPoolShareBps: 740,
              topNonPoolHolders: [],
              largestNonPoolHolder: { address: address(0x7001), shareBps: 210 },
              creator: CREATOR,
              creatorShareBps: 95
            },
            sellSimulation: {
              status: "passed",
              method: "holder-to-pool-transfer",
              holder: address(0x7001),
              amount: "1000000000000000000",
              returnStyle: "boolean-true"
            },
            warnings: [],
            checkedAt: nowIso
          };

          async function installFixtures(page) {
            await page.route("**/api/markets/external**", async (route) => {
              const requestUrl = new URL(route.request().url());
              const contract = requestUrl.searchParams.get("contract");
              const filtered = contract
                ? markets.filter((market) => market.address.toLowerCase() === contract.toLowerCase())
                : markets;
              await route.fulfill({
                status: 200,
                contentType: "application/json",
                body: JSON.stringify({
                  markets: filtered,
                  source: "terminal-visual-fixture",
                  rankingVersion: "visual-v1",
                  thresholds: {},
                  originCoverage: "complete",
                  rmtOriginCoverage: "complete",
                  stockAssetCoverage: "complete",
                  delayedSources: [],
                  updatedAt: nowIso,
                  stale: false
                })
              });
            });
            await page.route("**/api/markets/ohlcv**", async (route) => {
              const requestUrl = new URL(route.request().url());
              const range = requestUrl.searchParams.get("range") ?? "LIVE";
              await route.fulfill({
                status: 200,
                contentType: "application/json",
                body: JSON.stringify({
                  token: TOKEN,
                  pair: PAIR,
                  range,
                  candles: candles(range),
                  source: "GeckoTerminal",
                  updatedAt: nowIso,
                  lastTradeAt: trades[0].timestamp,
                  refreshMs: 60_000
                })
              });
            });
            await page.route("**/api/trade/external-venues**", async (route) => {
              await route.fulfill({
                status: 200,
                contentType: "application/json",
                body: JSON.stringify({
                  token: TOKEN,
                  venues: [{
                    venue: "sushi",
                    pair: PAIR,
                    dexId: "sushiswap",
                    liquidityUsd: primaryMarket.liquidityUsd,
                    verification: "dex-and-route"
                  }]
                })
              });
            });
            await page.route("**/api/markets/external-trades**", async (route) => {
              await route.fulfill({
                status: 200,
                contentType: "application/json",
                body: JSON.stringify(tradePayload)
              });
            });
            await page.route("**/api/markets/external-stream**", async (route) => {
              await route.fulfill({
                status: 200,
                headers: {
                  "Cache-Control": "no-cache",
                  "Content-Type": "text/event-stream",
                  Connection: "keep-alive"
                },
                body: `event: snapshot\ndata: ${JSON.stringify(tradePayload)}\n\n`
              });
            });
            await page.route("**/api/markets/token-risk**", async (route) => {
              await route.fulfill({
                status: 200,
                contentType: "application/json",
                body: JSON.stringify(riskPayload)
              });
            });
          }

          async function prepareContext(browser, options) {
            const context = await browser.newContext(options);
            await context.addInitScript(() => {
              localStorage.setItem("rmt:trading-terms", JSON.stringify({
                version: "2026-07-28",
                acceptedAt: new Date().toISOString()
              }));
              localStorage.setItem("rmt:experience-preferences", JSON.stringify({
                schemaVersion: 1,
                onboardingVersion: 1,
                diagnosticsEnabled: false,
                updatedAt: Date.now()
              }));
            });
            return context;
          }

          async function openReady(page, url, selector) {
            const response = await page.goto(url, { waitUntil: "domcontentloaded", timeout: 60_000 });
            if (!response || response.status() >= 400) throw new Error(`HTTP ${response?.status() ?? 0} for ${url}`);
            await page.locator(selector).first().waitFor({ state: "visible", timeout: 60_000 });
            await page.waitForTimeout(2_500);
          }

          async function capture(options, suffix) {
            const browser = await chromium.launch({ headless: true });
            const context = await prepareContext(browser, options);
            const page = await context.newPage();
            await installFixtures(page);

            await openReady(page, base, ".terminalPage");
            await page.locator(".runnerMarketCard").first().waitFor({ state: "visible", timeout: 30_000 });
            await page.screenshot({ path: `${output}/home-${suffix}.png`, fullPage: true });

            const marketUrl = `${base}/market/${TOKEN}`;
            await openReady(page, marketUrl, ".universalMarketHero");
            await page.locator(".universalChart svg").waitFor({ state: "visible", timeout: 30_000 });
            await page.screenshot({ path: `${output}/market-${suffix}.png`, fullPage: true });
            await browser.close();
            return { marketUrl };
          }

          const desktop = await capture({ viewport: { width: 1440, height: 1000 }, deviceScaleFactor: 1 }, "desktop");
          const mobile = await capture({ ...devices["iPhone 13"] }, "mobile");
          await writeFile(`${output}/capture.json`, JSON.stringify({ base, fixture: TOKEN, desktop, mobile }, null, 2));
          SCRIPT
          node /tmp/terminal-playwright/capture-terminal.mjs
      - name: Upload rendered desktop and mobile evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: terminal-rendered-preview
          path: terminal-captures
          if-no-files-found: error
          retention-days: 7
      - name: Print local server diagnostics on failure
        if: failure()
        run: cat /tmp/rmt-terminal.log || true
