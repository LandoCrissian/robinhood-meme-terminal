name: Terminal visual capture

on:
  workflow_dispatch:
  push:
    branches: [feat/terminal-rebuild]
    paths:
      - ".github/workflows/terminal-visual-capture.yml"

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PREVIEW_URL: https://robinhood-meme-terminal-git-feat-0fedbf-landocrissians-projects.vercel.app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Install deterministic browser runtime
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Capture the deployed terminal
        run: |
          mkdir -p terminal-captures
          cat > /tmp/capture-terminal.mjs <<'SCRIPT'
          import { chromium, devices } from "playwright";
          import { writeFile } from "node:fs/promises";

          const base = process.env.PREVIEW_URL;
          if (!base) throw new Error("PREVIEW_URL is required.");

          async function openReady(page, url, selector) {
            let lastError = "Preview did not become ready.";
            for (let attempt = 1; attempt <= 24; attempt += 1) {
              try {
                const response = await page.goto(url, { waitUntil: "domcontentloaded", timeout: 45_000 });
                const status = response?.status() ?? 0;
                const body = (await page.locator("body").innerText({ timeout: 15_000 })).slice(0, 500);
                if (status >= 200 && status < 400 && !/deployment.*building|not found/i.test(body)) {
                  await page.locator(selector).first().waitFor({ state: "visible", timeout: 30_000 });
                  await page.waitForTimeout(4_000);
                  return { attempt, status };
                }
                lastError = `HTTP ${status}: ${body}`;
              } catch (error) {
                lastError = error instanceof Error ? error.message : String(error);
              }
              await page.waitForTimeout(15_000);
            }
            throw new Error(lastError);
          }

          async function capture(contextOptions, suffix) {
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext(contextOptions);
            const page = await context.newPage();
            const home = await openReady(page, base, ".terminalPage");
            await page.screenshot({ path: `terminal-captures/home-${suffix}.png`, fullPage: true });

            const marketHref = await page.locator('a[href^="/market/"]').evaluateAll((links) => {
              const visible = links.find((link) => {
                const element = link;
                const rect = element.getBoundingClientRect();
                return rect.width > 0 && rect.height > 0;
              });
              return visible?.getAttribute("href") ?? links[0]?.getAttribute("href") ?? null;
            });
            if (!marketHref) throw new Error("No market workspace link was rendered on the preview terminal.");

            const marketUrl = new URL(marketHref, base).toString();
            const market = await openReady(page, marketUrl, ".professionalTradeWorkspace");
            await page.screenshot({ path: `terminal-captures/market-${suffix}.png`, fullPage: true });
            await browser.close();
            return { home, market, marketUrl };
          }

          const desktop = await capture({ viewport: { width: 1440, height: 1000 }, deviceScaleFactor: 1 }, "desktop");
          const mobile = await capture({ ...devices["iPhone 13"] }, "mobile");
          await writeFile("terminal-captures/capture.json", JSON.stringify({ base, desktop, mobile }, null, 2));
          SCRIPT
          node /tmp/capture-terminal.mjs
      - name: Upload rendered desktop and mobile evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: terminal-rendered-preview
          path: terminal-captures
          if-no-files-found: error
          retention-days: 7
