[extend]
useDefault = true

[[allowlists]]
description = "Public EVM token addresses in external-market smoke fixtures"
condition = "AND"
targetRules = ["generic-api-key"]
regexes = ['''^0x[0-9A-Fa-f]{40}$''']
paths = [
  '''^apps/web/lib/external-trades-smoke\.ts$''',
  '''^apps/web/lib/server/circus-curve-feed-smoke\.ts$''',
  '''^apps/web/lib/server/external-project-metadata-smoke\.ts$''',
  '''^apps/web/lib/vnext/fixtures/ccff00-public-audit-37451763\.json$''',
  '''^apps/web/lib/vnext/distribution-deployment-readiness\.ts$''',
]

[[allowlists]]
description = "Public EVM addresses on the canonical RMT identity and provenance page"
condition = "AND"
targetRules = ["generic-api-key"]
regexes = ['''^0x[0-9A-Fa-f]{40}$''']
paths = ['''^apps/web/app/rmt/page\.tsx$''']

[[allowlists]]
description = "Public CCFF00 EVM addresses in read-only presentation evidence"
condition = "AND"
targetRules = ["generic-api-key"]
regexes = ['''^0x[0-9A-Fa-f]{40}$''']
paths = ['''^apps/web/lib/vnext/distribution-ccff00-presentation\.ts$''']
