[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 200
via_ir = true
fs_permissions = [{ access = "read", path = "./test/fixtures" }]

[rpc_endpoints]
robinhood_testnet = "https://rpc.testnet.chain.robinhood.com/"
robinhood_mainnet = "https://rpc.mainnet.chain.robinhood.com/"

[fuzz]
runs = 512
