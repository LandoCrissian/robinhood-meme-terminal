[profile.default]
src = "src"
test = "test"
out = "out"
cache_path = "cache"
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
allow_paths = ["../nft-acquisition", "../seaport-verification"]
fs_permissions = [{ access = "read", path = "./official-artifacts.json" }, { access = "read", path = "../test/fixtures/safe-1.4.1/runtime.json" }]

[fuzz]
runs = 512

[invariant]
runs = 128
depth = 32
fail_on_revert = false
